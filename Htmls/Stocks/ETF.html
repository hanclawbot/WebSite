<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>台股ETF投資精靈</title>
<meta name="description" content="用證交所、櫃買中心、集保結算所公開資料分析台股 ETF 的配息方式、含息報酬與配置">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%99%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* 設計代碼（主線撰寫；所有元件樣式只能用這裡的變數，不可寫死顏色）
   版面概念：粉彩「精靈書桌」——奶白底、圓潤卡片、粗淺色邊框；數字密集區用等寬數字與安靜的底色，
   可愛感放在吉祥物、精靈卡片與按鈕，資料表與圖表保持清楚好讀。
   台股慣例：漲＝紅、跌＝綠（與歐美相反），並一律搭配 ▲▼ 符號，不單靠顏色。 */
:root {
  /* 底色與卡片 */
  --bg: #FFF7FA;            /* 粉櫻奶白 */
  --bg-dot: #FBE3EA;        /* 圓點背景的點 */
  --card: #FFFFFF;
  --card-pink: #FFF0F5;
  --card-mint: #F0FFF4;
  --card-cream: #FFFDE7;
  --card-sky: #E8F4FD;
  --card-lilac: #F4EEFF;
  --well: #FFF9F2;          /* 表格斑馬紋、輸入框底 */
  /* 文字 */
  --fg: #5D4037;            /* 深棕，不用純黑 */
  --fg-soft: #7A5C52;
  --muted: #9A7B70;
  --on-accent: #4A2C2A;     /* 壓在粉紅／橙色按鈕上的字 */
  /* 邊框與陰影 */
  --edge: #FADADD;
  --edge-strong: #F3B8C4;
  --edge-mint: #BFE8CF;
  --edge-cream: #F5E3A1;
  --edge-sky: #BBDDF5;
  --edge-lilac: #D9C8F5;
  --shadow: rgba(255, 182, 193, 0.38);
  --shadow-strong: rgba(240, 130, 160, 0.30);
  --scrim: rgba(93, 64, 55, 0.35);
  /* 強調 */
  --pink: #FF8FAB;
  --pink-strong: #D6336C;   /* 連結、focus 外框、選取狀態（對白底對比 ≥ 4.5） */
  --orange: #FFB74D;
  --orange-strong: #B26A00;
  --focus: #D6336C;
  /* 漲跌（台股：漲紅跌綠） */
  --up: #D6344B;
  --up-bg: #FFE3E8;
  --down: #12855F;
  --down-bg: #DFF5EC;
  --flat: #8A7A70;
  --flat-bg: #F1EBE7;
  /* 狀態 */
  --warn: #B26A00;
  --warn-bg: #FFF3D6;
  --danger: #C0392B;
  --danger-bg: #FDE7E3;
  --ok: #12855F;
  --ok-bg: #DFF5EC;
  /* 圖表：類別色（固定順序，不輪替；由圖表 worker 以驗證工具確認後可微調數值） */
  --cat-1: #D6336C;         /* 主角：本策略／本檔／5 日線 */
  --cat-2: #2F7FC1;         /* 對照一：加權指數／20 日線 */
  --cat-3: #B26A00;         /* 對照二：全市場／60 日線 */
  --cat-4: #6B4FBB;         /* 第四條線 */
  --chart-grid: #F3E3E6;
  --chart-axis: #9A7B70;
  --chart-surface: #FFFFFF;
  /* 圖表：漲跌發散色（熱力圖），中點是中性灰，兩端是紅與綠 */
  --div-up-3: #D6344B;
  --div-up-2: #EC7A8A;
  --div-up-1: #F8C4CC;
  --div-0: #EFE9E6;
  --div-down-1: #BFE6D6;
  --div-down-2: #6FC7A6;
  --div-down-3: #12855F;
  --div-na: #F6F1EE;        /* 沒有資料 */
  /* 因子雷達 */
  --radar-fill: rgba(255, 143, 171, 0.35);
  --radar-line: #D6336C;
  /* 字體與尺度 */
  --font: 'M PLUS Rounded 1c', 'Nunito', 'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif;
  --font-num: 'Nunito', 'M PLUS Rounded 1c', 'Microsoft JhengHei', sans-serif;
  --fs-xs: 0.78rem; --fs-sm: 0.88rem; --fs-md: 1rem; --fs-lg: 1.2rem; --fs-xl: 1.55rem; --fs-xxl: 2.1rem;
  --r-sm: 12px; --r-md: 18px; --r-lg: 26px; --r-pill: 999px;
  --gap-xs: 6px; --gap-sm: 10px; --gap-md: 16px; --gap-lg: 24px; --gap-xl: 36px;
  --border-w: 3px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #2A2331; --bg-dot: #372D40; --card: #362C40; --card-pink: #46303F; --card-mint: #2C4038; --card-cream: #453F2C; --card-sky: #2B3B4D; --card-lilac: #3B3350; --well: #302838;
    --fg: #F6EAF0; --fg-soft: #DCC8D2; --muted: #B5A0AC; --on-accent: #3A2030;
    --edge: #5A4560; --edge-strong: #7A5A78; --edge-mint: #47705C; --edge-cream: #7A6C3E; --edge-sky: #4A6A8A; --edge-lilac: #6A5A95;
    --shadow: rgba(10, 6, 14, 0.45); --shadow-strong: rgba(10, 6, 14, 0.6); --scrim: rgba(10, 6, 14, 0.6);
    --pink: #FF9DB5; --pink-strong: #FFA9C0; --orange: #FFC56B; --orange-strong: #FFCB7A; --focus: #FFA9C0;
    --up: #FF8496; --up-bg: #55303A; --down: #5FD3A8; --down-bg: #244A3D; --flat: #B9A9B0; --flat-bg: #41364A;
    --warn: #FFCB7A; --warn-bg: #4E4026; --danger: #FF9A8C; --danger-bg: #55302C; --ok: #5FD3A8; --ok-bg: #244A3D;
    --cat-1: #E65F93; --cat-2: #4396DB; --cat-3: #C2841E; --cat-4: #8F70E0;
    --chart-grid: #45384F; --chart-axis: #B5A0AC; --chart-surface: #362C40;
    --div-up-3: #FF7387; --div-up-2: #B5505F; --div-up-1: #6E3A46; --div-0: #473C50; --div-down-1: #2F5A4B; --div-down-2: #3B8E72; --div-down-3: #5FD3A8; --div-na: #3A3043;
    --radar-fill: rgba(255, 143, 176, 0.28); --radar-line: #FF8FB0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #2A2331; --bg-dot: #372D40; --card: #362C40; --card-pink: #46303F; --card-mint: #2C4038; --card-cream: #453F2C; --card-sky: #2B3B4D; --card-lilac: #3B3350; --well: #302838;
  --fg: #F6EAF0; --fg-soft: #DCC8D2; --muted: #B5A0AC; --on-accent: #3A2030;
  --edge: #5A4560; --edge-strong: #7A5A78; --edge-mint: #47705C; --edge-cream: #7A6C3E; --edge-sky: #4A6A8A; --edge-lilac: #6A5A95;
  --shadow: rgba(10, 6, 14, 0.45); --shadow-strong: rgba(10, 6, 14, 0.6); --scrim: rgba(10, 6, 14, 0.6);
  --pink: #FF9DB5; --pink-strong: #FFA9C0; --orange: #FFC56B; --orange-strong: #FFCB7A; --focus: #FFA9C0;
  --up: #FF8496; --up-bg: #55303A; --down: #5FD3A8; --down-bg: #244A3D; --flat: #B9A9B0; --flat-bg: #41364A;
  --warn: #FFCB7A; --warn-bg: #4E4026; --danger: #FF9A8C; --danger-bg: #55302C; --ok: #5FD3A8; --ok-bg: #244A3D;
  --cat-1: #E65F93; --cat-2: #4396DB; --cat-3: #C2841E; --cat-4: #8F70E0;
  --chart-grid: #45384F; --chart-axis: #B5A0AC; --chart-surface: #362C40;
  --div-up-3: #FF7387; --div-up-2: #B5505F; --div-up-1: #6E3A46; --div-0: #473C50; --div-down-1: #2F5A4B; --div-down-2: #3B8E72; --div-down-3: #5FD3A8; --div-na: #3A3043;
  --radar-fill: rgba(255, 143, 176, 0.28); --radar-line: #FF8FB0;
  color-scheme: dark;
}

/* 版面骨架與共用元件（worker F1）。所有顏色只用 tokens.css 的變數。
   Kawaii 風格：粉彩底、圓角、3px 粗淺色邊框、偏色柔和陰影；資料表與數字保持清楚好讀。 */

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

html {
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  scroll-padding-top: 76px;
}
body {
  margin: 0;
  font-family: var(--font);
  font-size: var(--fs-md);
  line-height: 1.6;
  color: var(--fg);
  background-color: var(--bg);
  background-image: radial-gradient(var(--bg-dot) 1.6px, transparent 1.8px);
  background-size: 22px 22px;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { margin: 0 0 var(--gap-xs); line-height: 1.35; font-weight: 800; color: var(--fg); }
h2 { font-size: var(--fs-lg); }
h3 { font-size: 1.08rem; }
p { margin: 0 0 var(--gap-sm); }
a { color: var(--pink-strong); text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img, svg { max-width: 100%; }
table { border-collapse: collapse; }

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

.sr-only {
  position: absolute !important;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ---------- 外層與頁首 ---------- */
#app {
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  min-width: 0;
}
@media (min-width: 900px) { #app { padding-left: 24px; padding-right: 24px; } }

#app-header {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto auto;
  grid-template-areas: "mascot brand badge btn" "search search search search";
  align-items: center;
  column-gap: var(--gap-md);
  row-gap: var(--gap-sm);
  padding: calc(14px + env(safe-area-inset-top, 0px)) 0 8px;
}
#app-header .mascot { grid-area: mascot; width: 68px; height: 68px; flex: none; }
#app-header .brand { grid-area: brand; min-width: 0; }
#app-header h1 { font-size: var(--fs-xl); margin: 0; letter-spacing: 0.02em; }
#app-header .tagline { margin: 0; font-size: var(--fs-sm); color: var(--fg-soft); }
#data-badge {
  grid-area: badge;
  justify-self: end;
  display: inline-block;
  padding: 6px 14px;
  font-size: var(--fs-sm);
  font-weight: 700;
  color: var(--fg-soft);
  background: var(--card-mint);
  border: var(--border-w) solid var(--edge-mint);
  border-radius: var(--r-pill);
}
#btn-data { grid-area: btn; }
#etf-search-wrap { grid-area: search; position: relative; z-index: 30; width: min(100%, 420px); min-width: 0; }
#etf-search { width: 100%; max-width: 100%; box-sizing: border-box; }
#etf-search-list {
  position: absolute; left: 0; right: 0; top: calc(100% + 6px);
  margin: 0; padding: 6px; list-style: none;
  max-height: min(60vh, 420px); overflow-y: auto;
  background: var(--card); color: var(--fg);
  border: var(--border-w) solid var(--edge-strong);
  border-radius: var(--r-md);
  box-shadow: 0 8px 24px var(--shadow-strong);
}
#etf-search-list[hidden] { display: none; }
.search-item {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  min-height: 40px; padding: 8px 12px; box-sizing: border-box;
  border-radius: var(--r-sm); cursor: pointer; min-width: 0;
}
.search-item:hover, .search-item.is-active { background: var(--card-pink); }
.search-item.is-active { outline: 2px solid var(--focus); outline-offset: -2px; }
.search-item .si-code { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 700; flex: none; }
.search-item .si-name { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.search-item .si-market { margin-left: auto; font-size: var(--fs-xs); color: var(--fg-soft); flex: none; }
.search-empty { padding: 10px 12px; color: var(--fg-soft); }
#glossary-back { margin-bottom: var(--gap-sm); }
#glossary-back[hidden] { display: none; }
@media (max-width: 720px) {
  #app-header {
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-areas: "mascot brand btn" "badge badge badge" "search search search";
  }
  #app-header .mascot { width: 54px; height: 54px; }
  #app-header h1 { font-size: 1.35rem; }
  #data-badge { justify-self: stretch; text-align: center; font-size: var(--fs-xs); padding: 6px 10px; }
}

.mascot { display: block; overflow: visible; animation: mascot-bob 3.6s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes mascot-bob {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-4px) rotate(2deg); }
}

/* ---------- 分頁 ---------- */
#tabs {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  display: flex;
  gap: 6px;
  padding: 8px 8px 10px;
  margin: 0 -8px;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
  background: var(--bg);
  border-bottom: 3px dotted var(--edge);
}
#tabs::-webkit-scrollbar { display: none; }
#tabs [role="tab"] {
  flex: 1 1 auto;
  min-height: 44px;
  padding: 0 12px;
  white-space: nowrap;
  font-weight: 700;
  font-size: 0.95rem;
  color: var(--fg-soft);
  background: var(--card);
  border: var(--border-w) solid var(--edge);
  border-radius: var(--r-pill);
  transition: transform 0.15s ease, background-color 0.15s ease;
}
#tabs [role="tab"]:hover { transform: scale(1.04); background: var(--card-pink); }
#tabs [role="tab"][aria-selected="true"] {
  color: var(--on-accent);
  background: var(--pink);
  border-color: var(--edge-strong);
  box-shadow: 0 4px 12px var(--shadow-strong);
}
#tabs [role="tab"]:focus-visible { outline-offset: -3px; }
#watch-count {
  display: inline-block;
  min-width: 1.6em;
  margin-left: 4px;
  padding: 0 6px;
  font-family: var(--font-num);
  font-size: var(--fs-xs);
  font-weight: 800;
  line-height: 1.6;
  text-align: center;
  color: var(--pink-strong);
  background: var(--card);
  border: 2px solid var(--edge-strong);
  border-radius: var(--r-pill);
}
#tabs [aria-selected="true"] #watch-count { color: var(--on-accent); }
@media (max-width: 480px) {
  #tabs { gap: 4px; }
  #tabs [role="tab"] { padding: 0 8px; font-size: 0.9rem; }
}

/* ---------- 主區域 ---------- */
main { min-width: 0; padding: var(--gap-md) 0 var(--gap-lg); min-height: 50vh; }
main > section { display: flex; flex-direction: column; gap: var(--gap-md); min-width: 0; }
main > section > * { min-width: 0; }

#loading, #empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--gap-sm);
  margin: var(--gap-lg) auto;
  padding: var(--gap-xl) var(--gap-md);
  max-width: 560px;
  text-align: center;
  background: var(--card-pink);
  border: var(--border-w) solid var(--edge-strong);
  border-radius: var(--r-lg);
  box-shadow: 0 8px 22px var(--shadow);
}
#loading .mascot, #empty-state .mascot { width: 96px; height: 96px; }
#loading p, #empty-state p { margin: 0; }
.loading-title { font-size: var(--fs-lg); font-weight: 800; }
.loading-dots { display: inline-flex; gap: 8px; margin-top: 4px; }
.loading-dots i {
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--pink);
  border: 2px solid var(--edge-strong);
  animation: dot-hop 1s ease-in-out infinite;
}
.loading-dots i:nth-child(2) { animation-delay: 0.15s; background: var(--orange); }
.loading-dots i:nth-child(3) { animation-delay: 0.3s; background: var(--card-lilac); }
@keyframes dot-hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-9px); } }

#disclaimer {
  margin: var(--gap-md) 0 calc(var(--gap-lg) + env(safe-area-inset-bottom, 0px));
  padding: var(--gap-sm) var(--gap-md);
  font-size: var(--fs-xs);
  line-height: 1.7;
  text-align: center;
  color: var(--muted);
  background: var(--card-cream);
  border: var(--border-w) dashed var(--edge-cream);
  border-radius: var(--r-md);
}

/* ---------- 共用元件 ---------- */
.card {
  background: var(--card);
  border: var(--border-w) solid var(--edge);
  border-radius: var(--r-lg);
  box-shadow: 0 6px 18px var(--shadow);
  padding: var(--gap-md);
  min-width: 0;
}
@media (min-width: 720px) { .card { padding: 20px; } }
.card.pink { background: var(--card-pink); border-color: var(--edge-strong); }
.card.mint { background: var(--card-mint); border-color: var(--edge-mint); }
.card.cream { background: var(--card-cream); border-color: var(--edge-cream); }
.card.sky { background: var(--card-sky); border-color: var(--edge-sky); }
.card.lilac { background: var(--card-lilac); border-color: var(--edge-lilac); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 40px;
  padding: 0 18px;
  font-weight: 700;
  font-size: var(--fs-md);
  line-height: 1.2;
  text-decoration: none;
  white-space: nowrap;
  color: var(--fg);
  background: var(--card);
  border: var(--border-w) solid var(--edge-strong);
  border-radius: var(--r-pill);
  box-shadow: 0 3px 0 var(--shadow);
  transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
}
.btn:hover:not(:disabled) { transform: scale(1.04); }
.btn:active:not(:disabled) { transform: scale(0.97); box-shadow: 0 1px 0 var(--shadow); }
.btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.btn:disabled, .btn[aria-disabled="true"] { opacity: 0.55; cursor: not-allowed; box-shadow: none; }
.btn-primary { color: var(--on-accent); background: var(--pink); border-color: var(--edge-strong); }
.btn-soft { color: var(--on-accent); background: var(--orange); border-color: var(--edge-cream); }
.btn-ghost { background: transparent; box-shadow: none; border-color: var(--edge-strong); }
.btn-ghost:hover:not(:disabled) { background: var(--card-pink); }
.btn-sm { min-height: 32px; padding: 0 12px; font-size: var(--fs-sm); border-width: 2px; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 28px;
  padding: 2px 12px;
  font-size: var(--fs-sm);
  font-weight: 700;
  line-height: 1.3;
  color: var(--fg-soft);
  background: var(--card-lilac);
  border: 2px solid var(--edge-lilac);
  border-radius: var(--r-pill);
}
.chip.on { color: var(--on-accent); background: var(--pink); border-color: var(--edge-strong); }
.chip.warn { color: var(--warn); background: var(--warn-bg); border-color: var(--edge-cream); }

.badge {
  display: inline-flex;
  align-items: center;
  padding: 0 8px;
  font-size: var(--fs-xs);
  font-weight: 800;
  line-height: 1.6;
  white-space: nowrap;
  color: var(--fg-soft);
  background: var(--flat-bg);
  border-radius: var(--r-pill);
}
.badge.up { color: var(--up); background: var(--up-bg); }
.badge.down { color: var(--down); background: var(--down-bg); }
.badge.flat { color: var(--flat); background: var(--flat-bg); }
.badge.warn { color: var(--warn); background: var(--warn-bg); }

.up { color: var(--up); }
.down { color: var(--down); }
.flat { color: var(--flat); }

.num {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  text-align: right;
}
.muted { color: var(--muted); }
.soft { color: var(--fg-soft); }

.tile {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 12px 16px;
  min-width: 0;
  background: var(--card);
  border: var(--border-w) solid var(--edge);
  border-radius: var(--r-md);
  box-shadow: 0 4px 12px var(--shadow);
}
.tile-label { font-size: var(--fs-sm); font-weight: 700; color: var(--fg-soft); }
.tile-value { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: var(--fs-xl); font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
.tile-sub { font-size: var(--fs-xs); color: var(--muted); }

/* 資料表 */
.table-wrap {
  overflow: auto;
  max-width: 100%;
  max-height: 75vh;
  background: var(--card);
  border: var(--border-w) solid var(--edge);
  border-radius: var(--r-md);
  -webkit-overflow-scrolling: touch;
}
.table-wrap.free { max-height: none; }
.table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 0.92rem;
}
.table th, .table td {
  padding: 6px 10px;
  text-align: left;
  vertical-align: middle;
  border-bottom: 1px solid var(--edge);
}
.table th.num, .table td.num { text-align: right; }
.table thead th {
  position: sticky;
  top: 0;
  z-index: 2;
  height: 44px;
  font-size: var(--fs-sm);
  font-weight: 800;
  white-space: nowrap;
  color: var(--fg-soft);
  background: var(--card-pink);
  border-bottom: var(--border-w) solid var(--edge-strong);
}
.table tbody tr { height: 40px; }
.table tbody tr:nth-child(even) { background: var(--well); }
.table tbody tr:hover { background: var(--card-pink); }
.table tbody tr:last-child td { border-bottom: 0; }
.table tbody tr:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
.table th[aria-sort] { color: var(--pink-strong); }

/* 表單 */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .field-label { font-size: var(--fs-sm); font-weight: 700; color: var(--fg-soft); }
.input, .select {
  width: 100%;
  min-height: 40px;
  padding: 6px 14px;
  font-size: var(--fs-md);
  color: var(--fg);
  background: var(--well);
  border: var(--border-w) solid var(--edge-strong);
  border-radius: var(--r-md);
  transition: border-color 0.15s ease;
}
.input::placeholder { color: var(--muted); opacity: 1; }
.input:hover, .select:hover { border-color: var(--pink); }
.input:focus-visible, .select:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
.select { padding-right: 8px; }
.select[multiple] { padding: 6px 8px; }
input[type="checkbox"], input[type="radio"] { accent-color: var(--pink-strong); width: 1.15rem; height: 1.15rem; }
input[type="range"] { accent-color: var(--pink-strong); }

/* 名詞小問號 */
.term {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 26px;
  height: 26px;
  padding: 0 6px;
  margin: 0 2px;
  vertical-align: middle;
  font-size: 0.8rem;
  font-weight: 800;
  line-height: 1;
  color: var(--pink-strong);
  background: var(--card-lilac);
  border: 2px solid var(--edge-lilac);
  border-radius: var(--r-pill);
  transition: transform 0.15s ease, background-color 0.15s ease;
}
.term:hover { transform: scale(1.15); background: var(--card-pink); }

/* 版面輔助 */
.row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--gap-sm); min-width: 0; }
.stack { display: flex; flex-direction: column; gap: var(--gap-md); min-width: 0; }
.spacer { flex: 1 1 auto; }
.grid-2, .grid-3, .grid-auto { display: grid; gap: var(--gap-md); min-width: 0; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-auto { grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); }
.grid-2 > *, .grid-3 > *, .grid-auto > * { min-width: 0; }
@media (max-width: 960px) { .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 720px) { .grid-2, .grid-3 { grid-template-columns: minmax(0, 1fr); } }

.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--gap-xs);
  padding: var(--gap-lg) var(--gap-md);
  text-align: center;
  color: var(--fg-soft);
  background: var(--card-cream);
  border: var(--border-w) dashed var(--edge-cream);
  border-radius: var(--r-lg);
}
.empty > :first-child { font-size: 2rem; line-height: 1.2; }
.empty p { margin: 0; }

/* ---------- 提示訊息 ---------- */
#toast {
  position: fixed;
  left: 50%;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  z-index: 100;
  max-width: calc(100vw - 32px);
  padding: 10px 20px;
  font-weight: 700;
  text-align: center;
  color: var(--fg);
  background: var(--card);
  border: var(--border-w) solid var(--edge-strong);
  border-radius: var(--r-pill);
  box-shadow: 0 8px 24px var(--shadow-strong);
  transform: translateX(-50%);
  animation: toast-pop 0.25s ease-out;
  pointer-events: none;
}
@keyframes toast-pop {
  from { opacity: 0; transform: translate(-50%, 12px) scale(0.95); }
  to { opacity: 1; transform: translate(-50%, 0) scale(1); }
}

/* ---------- 資料面板 ---------- */
body.has-modal { overflow: hidden; }
#data-scrim {
  position: fixed;
  inset: 0;
  z-index: 69;
  background: var(--scrim);
}
#data-panel {
  position: fixed;
  top: 50%;
  left: 50%;
  z-index: 70;
  width: min(580px, calc(100vw - 32px));
  max-height: calc(100vh - 32px);
  max-height: calc(100dvh - 32px);
  overflow: auto;
  padding: 20px;
  transform: translate(-50%, -50%);
  background: var(--card);
  border: var(--border-w) solid var(--edge-strong);
  border-radius: var(--r-lg);
  box-shadow: 0 14px 40px var(--shadow-strong);
}
#data-panel .panel-head { display: flex; align-items: center; gap: var(--gap-sm); margin-bottom: var(--gap-sm); }
#data-panel .panel-head h2 { flex: 1 1 auto; margin: 0; }
.data-facts {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr);
  gap: 4px var(--gap-md);
  margin: 0 0 var(--gap-md);
  padding: var(--gap-sm) var(--gap-md);
  font-size: var(--fs-sm);
  background: var(--well);
  border: 2px solid var(--edge);
  border-radius: var(--r-md);
}
.data-facts dt { color: var(--fg-soft); font-weight: 700; }
.data-facts dd { margin: 0; font-family: var(--font-num); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
#data-warnings { margin-bottom: var(--gap-md); font-size: var(--fs-sm); }
#data-warnings h3 { font-size: var(--fs-md); }
#data-warnings ul { margin: 0; padding-left: 1.2em; }
#data-warnings li { color: var(--warn); }
#update-box { display: flex; flex-direction: column; gap: var(--gap-sm); margin-bottom: var(--gap-md); }
#update-box .row > .field { flex: 1 1 200px; }
#update-message:empty { display: none; }
#update-message { margin: 0; font-size: var(--fs-sm); min-height: 1.5em; color: var(--fg-soft); }
#update-message.is-error { color: var(--danger); font-weight: 700; }
#update-hint { margin: 0; font-weight: 700; color: var(--fg-soft); }
#data-sources { margin: 0; font-size: var(--fs-xs); line-height: 1.7; color: var(--muted); }
progress {
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
  height: 16px;
  overflow: hidden;
  border: 0;
  border-radius: var(--r-pill);
  background: var(--well);
  outline: 3px solid var(--edge-strong);
  outline-offset: -3px;
}
progress::-webkit-progress-bar { background: var(--well); }
progress::-webkit-progress-value { background: var(--pink); border-radius: var(--r-pill); transition: width 0.2s ease; }
progress::-moz-progress-bar { background: var(--pink); border-radius: var(--r-pill); }

/* ---------- 小辭典 ---------- */
#view-glossary .glossary-head { display: flex; flex-direction: column; gap: var(--gap-sm); }
#view-glossary .glossary-head p { margin: 0; color: var(--fg-soft); }
#glossary-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: var(--gap-md); align-items: start; }
.term-card { scroll-margin-top: 84px; transition: transform 0.15s ease, box-shadow 0.15s ease; }
.term-card:hover { transform: translateY(-2px); }
.term-card:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.term-card h3 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; margin-bottom: var(--gap-sm); font-size: 1.12rem; }
.term-card h3 small { font-size: var(--fs-xs); font-weight: 700; color: var(--muted); }
.term-card .term-group { margin-left: auto; font-size: var(--fs-xs); min-height: 0; padding: 0 10px; }
.term-card p { margin: 0 0 var(--gap-sm); line-height: 1.75; }
.term-card p:last-child { margin-bottom: 0; }
.term-card .term-tag {
  display: inline-block;
  margin-right: 6px;
  padding: 0 10px;
  font-size: var(--fs-xs);
  font-weight: 800;
  color: var(--on-accent);
  background: var(--orange);
  border-radius: var(--r-pill);
}
.term-card .term-read .term-tag { background: var(--pink); }
.term-card.is-focus {
  border-color: var(--pink-strong);
  box-shadow: 0 0 0 5px var(--shadow-strong), 0 10px 24px var(--shadow-strong);
  animation: card-wiggle 0.6s ease-out;
}
@keyframes card-wiggle {
  0% { transform: scale(0.97); }
  50% { transform: scale(1.025); }
  100% { transform: scale(1); }
}

/* ---------- 無動畫偏好 ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
  .btn:hover:not(:disabled), #tabs [role="tab"]:hover, .term:hover, .term-card:hover { transform: none; }
}

/* ETF 投資精靈專用樣式。顏色只用 tokens.css 的變數。 */
.small { font-size: var(--fs-sm); }
.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; align-items: center; }
.row { display: flex; gap: var(--gap-sm); align-items: center; }
.warn { color: var(--warn); font-weight: 700; }
.ok { color: var(--ok); font-weight: 700; }
code { background: var(--well); padding: 1px 6px; border-radius: 6px; }
main > section > .card, main > section > .grid-2, main > section > .grid-3, main > section > div { margin-bottom: var(--gap-md); }
.card h2 { margin-bottom: var(--gap-sm); }

/* 頁首搜尋框（沿用 base 的 #etf-search 規則） */
#etf-search-wrap { grid-area: search; position: relative; }
#stale-banner { margin: 0 0 var(--gap-sm); padding: 10px 16px; }

/* 首頁主視覺 */
.hero { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: var(--gap-lg); align-items: center; }
.hero-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap-sm); }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; } }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--gap-sm); margin: var(--gap-sm) 0 var(--gap-md); }
.tile .tile-value .num, .tile-value { font-variant-numeric: tabular-nums; }

/* 標籤 */
.badge.cat { background: var(--card-lilac); border-color: var(--edge-lilac); }
.badge.cat-market { background: var(--card-pink); border-color: var(--edge-strong); }
.badge.cat-div { background: var(--card-cream); border-color: var(--edge-cream); }
.badge.cat-bond, .badge.cat-world, .badge.cat-worldtheme, .badge.cat-balanced { background: var(--card-sky); border-color: var(--edge-sky); }
.badge.cat-lev, .badge.cat-inv, .badge.cat-commodity { background: var(--warn-bg); border-color: var(--edge-cream); }
.badge.freq { background: var(--card-mint); border-color: var(--edge-mint); white-space: nowrap; }
.badge.freq small { margin-left: 4px; font-weight: 500; color: var(--fg-soft); }
.badge.freq-0, .badge.freq-new { background: var(--flat-bg); border-color: var(--edge); }

/* ETF 連結 */
.etf-link { background: none; border: 0; padding: 0; color: var(--pink-strong); text-align: left; font: inherit; cursor: pointer; text-decoration: underline; text-decoration-color: var(--edge-strong); text-underline-offset: 3px; }
.etf-link:hover { text-decoration-color: var(--pink-strong); }
.etf-link b { color: var(--fg); }

.table-wrap.tall { max-height: 420px; overflow: auto; }
.table td { vertical-align: middle; }
.table tr.total td { font-weight: 800; background: var(--card-cream); }
.list-table td, .list-table th { white-space: nowrap; }
.sort-btn { background: none; border: 0; padding: 0; font: inherit; font-weight: 800; color: inherit; cursor: pointer; }
th[aria-sort="ascending"] .sort-btn::after { content: ' ▲'; color: var(--pink-strong); }
th[aria-sort="descending"] .sort-btn::after { content: ' ▼'; color: var(--pink-strong); }
.star { background: none; border: 0; font-size: 1.25rem; color: var(--muted); cursor: pointer; padding: 4px 6px; border-radius: 8px; }
.star.on { color: var(--orange-strong); }
.star:hover { background: var(--well); }

/* 篩選列 */
.filters { display: flex; flex-wrap: wrap; gap: var(--gap-sm) var(--gap-md); align-items: flex-end; margin-bottom: var(--gap-sm); }
.filters .field { min-width: 150px; margin: 0; }
.field.inline { display: flex; align-items: center; gap: 8px; margin: 0; }
.check { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; padding-bottom: 8px; }
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { cursor: pointer; }

/* 排行 */
.rank { margin: 0; padding-left: 1.6em; }
.rank li { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px dashed var(--edge); }
.rank li::marker { color: var(--muted); }
.rank li .num { white-space: nowrap; color: var(--fg-soft); }

/* 圖表 */
.chart { position: relative; width: 100%; min-width: 0; }
.chart svg { display: block; overflow: visible; }
.chart .grid { stroke: var(--chart-grid); stroke-width: 1; }
.chart .zero { stroke: var(--chart-axis); stroke-width: 1; }
.chart .axis { fill: var(--chart-axis); font-size: 11px; font-family: var(--font-num); }
.chart .crosshair { stroke: var(--chart-axis); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .hover-dot { stroke: var(--chart-surface); stroke-width: 2; }
.chart .marker-line { stroke: var(--edge-strong); stroke-width: 1; stroke-dasharray: 2 3; }
.chart .marker-dot { fill: var(--chart-surface); stroke: var(--cat-3); stroke-width: 2.5; }
.chart .bar { stroke: var(--chart-surface); stroke-width: 1; }
.chart .bar.dim { opacity: 0.35; }
.chart .donut-seg { stroke: var(--chart-surface); stroke-width: 2; }
.chart .donut-big { fill: var(--fg); font-size: 22px; font-weight: 800; font-family: var(--font-num); }
.donut-wrap { display: flex; flex-wrap: wrap; gap: var(--gap-md); align-items: center; justify-content: center; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: var(--fs-sm); color: var(--fg-soft); }
.donut-wrap .legend { flex-direction: column; }
.sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.chart-tip { position: fixed; z-index: 100; pointer-events: none; background: var(--card); color: var(--fg); border: 2px solid var(--edge-strong); border-radius: 12px; padding: 8px 12px; font-size: var(--fs-sm); box-shadow: 0 6px 18px var(--shadow); max-width: 280px; }
.chart-tip .tip-note { color: var(--muted); margin-top: 2px; }
.spark { vertical-align: middle; }

/* 詳情抽屜 */
#detail { position: fixed; top: 0; right: 0; bottom: 0; z-index: 60; width: min(960px, 100vw); overflow: auto; background: var(--bg); border-left: var(--border-w) solid var(--edge-strong); box-shadow: -10px 0 30px var(--shadow-strong); padding: 20px max(16px, env(safe-area-inset-right, 0px)) 40px 20px; }
#detail-scrim { position: fixed; inset: 0; z-index: 55; background: var(--scrim); }
.detail-head { display: flex; justify-content: space-between; gap: var(--gap-md); align-items: flex-start; margin-bottom: var(--gap-sm); }
.detail-head h2 { font-size: var(--fs-xl); margin: 2px 0 6px; }
.detail-actions { display: flex; gap: 8px; flex-shrink: 0; }
#detail .card { margin-bottom: var(--gap-md); }
#detail .grid-2 { margin-bottom: 0; }
ul.notes, ol.notes { margin: 0; padding-left: 1.3em; }
ul.notes li, ol.notes li { margin-bottom: 6px; }
@media (max-width: 600px) { .detail-head { flex-direction: column; } }

.month-cal { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: var(--gap-sm); }
.month-cal span { text-align: center; padding: 8px 0; border-radius: 10px; background: var(--well); border: 2px solid var(--edge); color: var(--muted); font-weight: 700; font-size: var(--fs-sm); }
.month-cal span.on { background: var(--card-mint); border-color: var(--down); color: var(--down); }
.month-cal span.on::before { content: '💰'; display: block; font-size: 0.9rem; }

/* 配息解析 */
.freq-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--gap-md); }
.freq-card .pc { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap-sm); }
.freq-card h4 { margin: 4px 0; font-size: var(--fs-sm); }
.freq-card ul { margin: 0; padding-left: 1.1em; font-size: var(--fs-sm); }
.freq-card li { margin-bottom: 4px; }
@media (max-width: 480px) { .freq-card .pc { grid-template-columns: 1fr; } }
.example-box { display: flex; align-items: flex-end; justify-content: center; gap: var(--gap-md); padding: var(--gap-sm); }
.ex-col { width: 120px; text-align: center; }
.ex-col p { font-size: var(--fs-sm); margin-top: 6px; }
.ex-col > .ex-bar, .ex-stack { height: 150px; }
.ex-stack { display: flex; flex-direction: column; }
.ex-bar { background: var(--pink); border: 2px solid var(--pink-strong); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--on-accent); font-weight: 800; }
.ex-stack .ex-bar { height: auto; }
.ex-stack .ex-bar.cash { background: var(--ok); border-color: var(--ok); min-height: 14px; margin-bottom: 4px; }
.ex-arrow { font-size: 2rem; color: var(--muted); padding-bottom: 60px; }

/* 月月配挑選 */
.pick-col { margin: 0; }
.pick-col legend { font-weight: 800; padding: 0 6px; }
.pick { display: flex; gap: 8px; align-items: flex-start; padding: 8px; border-radius: 12px; border: 2px solid transparent; cursor: pointer; margin-bottom: 4px; }
.pick:hover { background: var(--well); }
.pick.on { border-color: var(--pink); background: var(--card-pink); }
.pick input { margin-top: 5px; }
.warn-box { background: var(--warn-bg); border: 2px solid var(--edge-cream); border-radius: 12px; padding: 10px 14px; }

/* 配置精靈 */
.plan-form { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--gap-sm) var(--gap-md); align-items: end; }
.plan-form .wide { grid-column: 1 / -1; }
.plan-form .field { margin: 0; }
.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.seg-item { position: relative; }
.seg-item input { position: absolute; opacity: 0; }
.seg-item span { display: block; padding: 10px 12px; border-radius: 14px; border: var(--border-w) solid var(--edge); background: var(--card); cursor: pointer; }
.seg-item span small { display: block; color: var(--muted); }
.seg-item input:checked + span { border-color: var(--pink-strong); background: var(--card-pink); }
.seg-item input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
.plan-table select { max-width: 280px; }
.assume { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 8px 0; }
.assume input { width: 72px; display: inline-block; }
details summary { cursor: pointer; font-weight: 700; color: var(--pink-strong); }

.cmp-table th[scope="row"] { white-space: nowrap; text-align: left; }
.cmp-table thead th { white-space: nowrap; }
.term-card { margin-bottom: var(--gap-sm); }
.table .etf-link { white-space: nowrap; }
.plan-table { min-width: 680px; }
.cmp-table { min-width: 560px; }
@media (max-width: 480px) { #app-header h1 { font-size: 1.25rem; } }

</style>
</head>
<body>
<div id="app">
  <!-- 吉祥物「小金」：原創的金幣小精靈（頭頂嫩芽＝讓錢慢慢長大）。顏色全部取自設計代碼。 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="mascot-art" viewBox="0 0 120 120">
        <ellipse cx="60" cy="112" rx="30" ry="5" fill="var(--edge-strong)" opacity="0.55"/>
        <!-- 嫩芽 -->
        <path d="M60 30 Q60 18 60 12" stroke="var(--down)" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M60 18 Q46 4 36 14 Q46 24 60 18 Z" fill="var(--edge-mint)" stroke="var(--down)" stroke-width="2.5" stroke-linejoin="round"/>

/* 比較、稅費試算、小辭典 */
(function (root) {
  const ETF = root.ETF, U = ETF.util, AN = ETF.analyze, P = ETF.plan, LE = ETF.learn;
  const COLORS = ['var(--cat-1)', 'var(--cat-2)', 'var(--cat-3)', 'var(--cat-4)'];

  /* ---------- 比較 ---------- */
  ETF.app.views.compare = function (sec, app) {
    const H = app.h;
    const list = app.compare.map(c => app.byCode[c]).filter(Boolean);
    const quick = [['0050', '0056', '00878', '00919'], ['0050', '006208', '00646', '00679B'], ['00679B', '00720B', '00937B', '00687B']];
    sec.innerHTML = `
      <div class="card">
        <h2>ETF 比較（最多 4 檔）</h2>
        <div class="row wrap">
          <label class="sr-only" for="cmp-add">加入 ETF 代號</label>
          <input id="cmp-add" class="input" placeholder="輸入代號，例如 00878" list="cmp-codes" style="max-width:220px">
          <datalist id="cmp-codes">${app.list.map(a => `<option value="${a.code}">${U.esc(a.name)}</option>`).join('')}</datalist>
          <button type="button" class="btn btn-primary btn-sm" id="cmp-add-btn">加入</button>
          <span class="muted small">或快速比較：</span>
          ${quick.map((q, i) => `<button type="button" class="chip" data-quick="${i}">${q.join(' vs ')}</button>`).join('')}
        </div>
      </div>
      ${list.length ? `
      <div class="card">
        <div class="table-wrap"><table class="table cmp-table">
          <thead><tr><th>項目</th>${list.map((a, i) => `<th><i class="sw" style="background:${COLORS[i]}"></i>${H.link(a)}<button type="button" class="btn btn-ghost btn-sm" data-rm="${a.code}" aria-label="移除 ${a.code}">✕</button></th>`).join('')}</tr></thead>
          <tbody>${[
            ['類型', a => H.catBadge(a)], ['配息頻率', a => H.freqBadge(a)], ['收盤價', a => U.fmt(a.price, 2)],
            ['近一年殖利率', a => H.plainPct(a.ttmYield)], ['年化配息率', a => H.plainPct(a.annualized)],
            ['近一年含息報酬', a => a.r1y && a.r1y.full ? H.pct(a.r1y.total) : '—'], ['近一年價格報酬', a => a.r1y && a.r1y.full ? H.pct(a.r1y.price) : '—'],
            ['近 6 個月含息', a => a.r6m && a.r6m.full ? H.pct(a.r6m.total) : '—'], ['年化波動', a => a.vol != null ? U.fmtPct(a.vol, 1) : '—'],
            ['最大回落', a => a.mdd != null ? U.fmtPct(a.mdd, 1) : '—'], ['30 日內填息比例', a => a.fill30 != null ? U.fmtPct(a.fill30, 0) : '—'],
            ['規模', a => H.yi(a.size)], ['受益人數', a => a.holders != null ? U.fmtInt(a.holders) : '—'], ['折溢價', a => H.prem(a.premium)],
            ['日均成交', a => a.avgValue != null ? U.fmtYi(a.avgValue) : '—'], ['上市日期', a => a.e.listed ? U.fmtDate(a.e.listed) : '—'],
            ['追蹤指數', a => `<span class="small">${U.esc(a.e.index || '—')}</span>`],
          ].map(([t, f]) => `<tr><th scope="row">${t}</th>${list.map(a => `<td class="num">${f(a)}</td>`).join('')}</tr>`).join('')}</tbody>
        </table></div>
      </div>
      <div class="card"><h3>近一年含息報酬走勢（起點＝100，配息再投入）</h3><div id="cmp-line"></div></div>
      <div class="card"><h3>持有 100 萬元時，每月配息（依最近一年）</h3><div id="cmp-bars"></div></div>` :
      '<div class="card empty"><p>還沒有要比較的 ETF。可以在上面輸入代號、按快速比較，或在列表與詳情頁按 ☆。</p></div>'}`;
    const add = code => { code = String(code || '').trim().toUpperCase(); if (!app.byCode[code]) { app.toast('找不到 ' + code); return; } if (!app.compare.includes(code)) app.toggleCompare(code); app.rerender('compare'); };
    sec.querySelector('#cmp-add-btn').onclick = () => add(sec.querySelector('#cmp-add').value);
    sec.querySelector('#cmp-add').onkeydown = e => { if (e.key === 'Enter') add(e.target.value); };
    sec.querySelectorAll('[data-quick]').forEach(b => b.onclick = () => { app.compare.splice(0, app.compare.length, ...quick[b.dataset.quick].filter(c => app.byCode[c])); app.store.set('compare', app.compare); document.querySelector('#compare-count').textContent = app.compare.length; app.rerender('compare'); });
    sec.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { app.toggleCompare(b.dataset.rm); app.rerender('compare'); });
    if (!list.length) return;
    const s = app.snap, dates = s.dates;
    const i0 = AN.idxOnOrAfter(dates, U.addDays(s.asOf, -365));
    const ds = dates.slice(i0);
    const series = list.map((a, k) => {
      const c = a.e.c, cashOn = {}; for (const d of a.e.divs) cashOn[d.d] = (cashOn[d.d] || 0) + d.cash;
      let t = null, prev = null; const v = [];
      for (let i = i0; i < dates.length; i++) {
        if (c[i] == null) { v.push(null); continue; }
        if (t == null) t = 100; else t *= (c[i] + (cashOn[dates[i]] || 0)) / prev;
        prev = c[i]; v.push(t);
      }
      return { name: a.code + ' ' + a.name, values: v, color: COLORS[k] };
    });
    ETF.charts.line(sec.querySelector('#cmp-line'), { dates: ds, series, label: '含息報酬比較', yFmt: v => U.fmt(v, 0), height: 280 });
    const rows = list.map((a, k) => ({ name: a.code + ' ' + a.name, values: P.monthlyCash(a, a.price ? 1e6 / a.price : 0, s.asOf), color: COLORS[k] }));
    // 比較時各檔並排看，不堆疊：用每檔一組
    ETF.charts.bars(sec.querySelector('#cmp-bars'), { label: '每月配息比較', height: 220, labels: Array.from({ length: 12 }, (_, i) => (i + 1) + '月'), series: rows, grouped: true, yFmt: v => U.fmtInt(v), left: 56, tipTitle: i => `${i + 1} 月` });
  };

  /* ---------- 稅費試算 ---------- */
  ETF.app.views.tax = function (sec, app) {
    const H = app.h;
    const st = Object.assign({ code: '00878', lots: 20, rate: 0.12, other: 0 }, app.store.get('tax', {}));
    sec.innerHTML = `
      <div class="card">
        <h2>🧾 配息的稅與二代健保試算</h2>
        <p>選一檔 ETF 和持有張數，依<b>最近一年實際配息</b>估算每次入帳金額、二代健保補充保費，以及股利所得稅「合併計稅」與「分開計稅」哪個划算。</p>
        <div class="filters">
          <div class="field"><label for="t-code">ETF 代號</label><input id="t-code" class="input" list="t-codes" value="${U.esc(st.code)}"><datalist id="t-codes">${app.list.filter(a => a.ttmCash > 0).map(a => `<option value="${a.code}">${U.esc(a.name)}</option>`).join('')}</datalist></div>
          <div class="field"><label for="t-lots">持有張數</label><input id="t-lots" class="input num" type="number" min="0" step="1" value="${st.lots}"></div>
          <div class="field"><label for="t-rate">綜合所得稅邊際稅率</label><select id="t-rate" class="select">${[0.05, 0.12, 0.2, 0.3, 0.4].map(r => `<option value="${r}"${r === st.rate ? ' selected' : ''}>${r * 100}%</option>`).join('')}</select></div>
          <div class="field"><label for="t-other">其他股利所得（元／年）</label><input id="t-other" class="input num" type="number" min="0" step="10000" value="${st.other}"></div>
        </div>
      </div>
      <div id="tax-out"></div>
      <div class="card cream"><h3>重要說明</h3><ul class="notes small">
        <li>二代健保補充保費：單次股利 ≥ 2 萬元時扣 2.11%（單次上限 1,000 萬元）。</li>
        <li>股利所得：合併計稅可抵減 8.5%（每戶上限 8 萬元），或分開計稅單一稅率 28%，兩者擇一。</li>
        <li>ETF 配息組成（股利、利息、資本利得、收益平準金）稅務處理不同；本試算把配息全部當股利所得，是<b>保守估計</b>。國內債券 ETF 的海外利息屬海外所得，通常不扣補充保費、也不計入綜所稅，實際以投信公告與扣繳憑單為準。</li>
        <li>稅率、門檻以財政部、健保署最新公告為準；本試算不構成稅務建議。</li>
      </ul></div>`;
    const $ = s => sec.querySelector(s);
    function render() {
      st.code = $('#t-code').value.trim().toUpperCase(); st.lots = Math.max(0, Number($('#t-lots').value) || 0);
      st.rate = Number($('#t-rate').value); st.other = Math.max(0, Number($('#t-other').value) || 0);
      app.store.set('tax', st);
      const a = app.byCode[st.code];
      if (!a) { $('#tax-out').innerHTML = '<div class="card"><p class="muted">請輸入有效的 ETF 代號</p></div>'; return; }
      const units = st.lots * 1000;
      const pays = a.e.divs.filter(d => d.d > U.addDays(app.snap.asOf, -365)).map(d => ({ d: d.d, cash: d.cash, amt: d.cash * units }));
      const isBond = a.cat === 'bond';
      pays.forEach(p => { p.nhi = isBond ? 0 : P.nhi(p.amt); });
      const annual = U.sum(pays.map(p => p.amt)), nhiTot = U.sum(pays.map(p => p.nhi));
      const t = P.dividendTax(annual + st.other, st.rate);
      const tOther = P.dividendTax(st.other, st.rate);
      const extraBest = Math.min(t.combined, t.separate) - Math.min(tOther.combined, tOther.separate);
      const maxLots = a.lastDiv ? P.nhiMaxLots(a.lastDiv.cash) : null;
      $('#tax-out').innerHTML = `
        <div class="card">
          <h2>${H.link(a)} 持有 ${U.fmtInt(st.lots)} 張（${U.fmtInt(units)} 單位）</h2>
          <div class="tiles">
            ${H.tile('一年配息（稅前）', `<span class="num">${U.fmtInt(annual)}</span> 元`, `${pays.length} 次・${H.freqBadge(a)}`)}
            ${H.tile('二代健保補充保費', `<span class="num">${U.fmtInt(nhiTot)}</span> 元`, isBond ? '債券 ETF 海外利息通常不扣' : `${pays.filter(p => p.nhi).length} 次超過 2 萬元`)}
            ${H.tile('合併計稅（這筆配息增加的稅）', `<span class="num">${U.fmtInt(t.combined - tOther.combined)}</span> 元`, `邊際稅率 ${st.rate * 100}%，可抵減 8.5%`)}
            ${H.tile('分開計稅（28%）', `<span class="num">${U.fmtInt(t.separate - tOther.separate)}</span> 元`, '')}
          </div>
          <p>👉 以你的條件，<b>${t.best === 'combined' ? '合併計稅' : '分開計稅'}</b>比較划算（全部股利 ${U.fmtInt(annual + st.other)} 元，相差約 ${U.fmtInt(t.saving)} 元）。這筆 ETF 配息實際增加的稅約 <b class="num">${U.fmtInt(extraBest)}</b> 元${extraBest < 0 ? '（負數＝可退稅，因為 8.5% 抵減大於你的稅率）' : ''}。
          ${isBond ? '<br><span class="muted small">債券 ETF：若配息為海外利息，實際上不計入綜所稅，上面的稅額會高估。</span>' : ''}</p>
          ${maxLots != null && !isBond ? `<p>💡 以最近一次配息 ${U.fmt(a.lastDiv.cash, 3)} 元計，持有 <b class="num">${U.fmt(maxLots, 2)}</b> 張以下，單次配息就不會超過 2 萬元門檻。</p>` : ''}
          <div class="table-wrap"><table class="table"><thead><tr><th>除息日</th><th class="num">每單位</th><th class="num">入帳（稅前）</th><th class="num">補充保費</th><th class="num">實拿</th></tr></thead>
          <tbody>${pays.map(p => `<tr><td class="num">${U.fmtDate(p.d)}</td><td class="num">${U.fmt(p.cash, 3)}</td><td class="num">${U.fmtInt(p.amt)}</td><td class="num">${p.nhi ? `<span class="warn">${U.fmtInt(p.nhi)}</span>` : '0'}</td><td class="num">${U.fmtInt(p.amt - p.nhi)}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">近一年沒有配息</td></tr>'}</tbody></table></div>
        </div>`;
    }
    sec.querySelectorAll('input,select').forEach(x => x.addEventListener('input', render));
    render();
  };

  /* ---------- 小辭典 ---------- */
  ETF.app.views.learn = function (sec, app) {
    const groups = [...new Set(LE.GLOSSARY.map(g => g.g))];
    sec.innerHTML = `
      <div class="card"><h2>📖 ETF 小辭典</h2>
        <div class="row wrap"><label class="sr-only" for="lg-q">搜尋名詞</label><input id="lg-q" class="input" type="search" placeholder="搜尋，例如：填息、二代健保" style="max-width:320px">
        ${groups.map(g => `<button type="button" class="chip" data-g="${g}">${g}</button>`).join('')}</div></div>
      <div id="glossary-list">${LE.GLOSSARY.map(t => `<article class="term-card card" id="term-${t.id}" data-g="${t.g}" tabindex="-1"><h3>${t.t} <small class="badge">${t.g}</small></h3><p>${t.b}</p></article>`).join('')}</div>`;
    const q = sec.querySelector('#lg-q');
    let g = '';
    function filt() {
      const s = q.value.trim();
      sec.querySelectorAll('.term-card').forEach(c => { c.hidden = (g && c.dataset.g !== g) || (s && !c.textContent.includes(s)); });
      sec.querySelectorAll('[data-g].chip').forEach(c => c.classList.toggle('on', c.dataset.g === g));
    }
    q.oninput = filt;
    sec.querySelectorAll('.chip[data-g]').forEach(c => c.onclick = () => { g = g === c.dataset.g ? '' : c.dataset.g; filt(); });
    ETF.app.views.learn.focus = id => {
      q.value = ''; g = ''; filt();
      const el = sec.querySelector('#term-' + id); if (!el) return;
      el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('is-focus'); el.focus({ preventScroll: true });
      setTimeout(() => el.classList.remove('is-focus'), 1800);
    };
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
