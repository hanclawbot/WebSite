<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>台股選股精靈</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%AE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* ==== src/ui/css/tokens.css ==== */
/* 設計代碼（主線撰寫；所有元件樣式只能用這裡的變數，不可寫死顏色）
   版面概念：粉彩「精靈書桌」——奶白底、圓潤卡片、粗淺色邊框；數字密集區用等寬數字與安靜的底色，
   可愛感放在吉祥物、精靈卡片與按鈕，資料表與圖表保持清楚好讀。
   台股慣例：漲＝紅、跌＝綠（與歐美相反），並一律搭配 ▲▼ 符號，不單靠顏色。 */
:root {
  /* 底色與卡片 */
  --bg: #FFF7FA;            /* 粉櫻奶白 */
  --bg-dot: #FBE3EA;        /* 圓點背景的點 */
  --card: #FFFFFF;
  --card-pink: #FFF0F5;
  --card-mint: #F0FFF4;
  --card-cream: #FFFDE7;
  --card-sky: #E8F4FD;
  --card-lilac: #F4EEFF;
  --well: #FFF9F2;          /* 表格斑馬紋、輸入框底 */
  /* 文字 */
  --fg: #5D4037;            /* 深棕，不用純黑 */
  --fg-soft: #7A5C52;
  --muted: #9A7B70;
  --on-accent: #4A2C2A;     /* 壓在粉紅／橙色按鈕上的字 */
  /* 邊框與陰影 */
  --edge: #FADADD;
  --edge-strong: #F3B8C4;
  --edge-mint: #BFE8CF;
  --edge-cream: #F5E3A1;
  --edge-sky: #BBDDF5;
  --edge-lilac: #D9C8F5;
  --shadow: rgba(255, 182, 193, 0.38);
  --shadow-strong: rgba(240, 130, 160, 0.30);
  --scrim: rgba(93, 64, 55, 0.35);
  /* 強調 */
  --pink: #FF8FAB;
  --pink-strong: #D6336C;   /* 連結、focus 外框、選取狀態（對白底對比 ≥ 4.5） */
  --orange: #FFB74D;
  --orange-strong: #B26A00;
  --focus: #D6336C;
  /* 漲跌（台股：漲紅跌綠） */
  --up: #D6344B;
  --up-bg: #FFE3E8;
  --down: #12855F;
  --down-bg: #DFF5EC;
  --flat: #8A7A70;
  --flat-bg: #F1EBE7;
  /* 狀態 */
  --warn: #B26A00;
  --warn-bg: #FFF3D6;
  --danger: #C0392B;
  --danger-bg: #FDE7E3;
  --ok: #12855F;
  --ok-bg: #DFF5EC;
  /* 圖表：類別色（固定順序，不輪替；由圖表 worker 以驗證工具確認後可微調數值） */
  --cat-1: #D6336C;         /* 主角：本策略／本檔／5 日線 */
  --cat-2: #2F7FC1;         /* 對照一：加權指數／20 日線 */
  --cat-3: #B26A00;         /* 對照二：全市場／60 日線 */
  --cat-4: #6B4FBB;         /* 第四條線 */
  --chart-grid: #F3E3E6;
  --chart-axis: #9A7B70;
  --chart-surface: #FFFFFF;
  /* 圖表：漲跌發散色（熱力圖），中點是中性灰，兩端是紅與綠 */
  --div-up-3: #D6344B;
  --div-up-2: #EC7A8A;
  --div-up-1: #F8C4CC;
  --div-0: #EFE9E6;
  --div-down-1: #BFE6D6;
  --div-down-2: #6FC7A6;
  --div-down-3: #12855F;
  --div-na: #F6F1EE;        /* 沒有資料 */
  /* 因子雷達 */
  --radar-fill: rgba(255, 143, 171, 0.35);
  --radar-line: #D6336C;
  /* 字體與尺度 */
  --font: 'M PLUS Rounded 1c', 'Nunito', 'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif;
  --font-num: 'Nunito', 'M PLUS Rounded 1c', 'Microsoft JhengHei', sans-serif;
  --fs-xs: 0.78rem; --fs-sm: 0.88rem; --fs-md: 1rem; --fs-lg: 1.2rem; --fs-xl: 1.55rem; --fs-xxl: 2.1rem;
  --r-sm: 12px; --r-md: 18px; --r-lg: 26px; --r-pill: 999px;
  --gap-xs: 6px; --gap-sm: 10px; --gap-md: 16px; --gap-lg: 24px; --gap-xl: 36px;
  --border-w: 3px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #2A2331; --bg-dot: #372D40; --card: #362C40; --card-pink: #46303F; --card-mint: #2C4038; --card-cream: #453F2C; --card-sky: #2B3B4D; --card-lilac: #3B3350; --well: #302838;
    --fg: #F6EAF0; --fg-soft: #DCC8D2; --muted: #B5A0AC; --on-accent: #3A2030;
    --edge: #5A4560; --edge-strong: #7A5A78; --edge-mint: #47705C; --edge-cream: #7A6C3E; --edge-sky: #4A6A8A; --edge-lilac: #6A5A95;
    --shadow: rgba(10, 6, 14, 0.45); --shadow-strong: rgba(10, 6, 14, 0.6); --scrim: rgba(10, 6, 14, 0.6);
    --pink: #FF9DB5; --pink-strong: #FFA9C0; --orange: #FFC56B; --orange-strong: #FFCB7A; --focus: #FFA9C0;
    --up: #FF8496; --up-bg: #55303A; --down: #5FD3A8; --down-bg: #244A3D; --flat: #B9A9B0; --flat-bg: #41364A;
    --warn: #FFCB7A; --warn-bg: #4E4026; --danger: #FF9A8C; --danger-bg: #55302C; --ok: #5FD3A8; --ok-bg: #244A3D;
    --cat-1: #E65F93; --cat-2: #4396DB; --cat-3: #C2841E; --cat-4: #8F70E0;
    --chart-grid: #45384F; --chart-axis: #B5A0AC; --chart-surface: #362C40;
    --div-up-3: #FF7387; --div-up-2: #B5505F; --div-up-1: #6E3A46; --div-0: #473C50; --div-down-1: #2F5A4B; --div-down-2: #3B8E72; --div-down-3: #5FD3A8; --div-na: #3A3043;
    --radar-fill: rgba(255, 143, 176, 0.28); --radar-line: #FF8FB0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #2A2331; --bg-dot: #372D40; --card: #362C40; --card-pink: #46303F; --card-mint: #2C4038; --card-cream: #453F2C; --card-sky: #2B3B4D; --card-lilac: #3B3350; --well: #302838;
  --fg: #F6EAF0; --fg-soft: #DCC8D2; --muted: #B5A0AC; --on-accent: #3A2030;
  --edge: #5A4560; --edge-strong: #7A5A78; --edge-mint: #47705C; --edge-cream: #7A6C3E; --edge-sky: #4A6A8A; --edge-lilac: #6A5A95;
  --shadow: rgba(10, 6, 14, 0.45); --shadow-strong: rgba(10, 6, 14, 0.6); --scrim: rgba(10, 6, 14, 0.6);
  --pink: #FF9DB5; --pink-strong: #FFA9C0; --orange: #FFC56B; --orange-strong: #FFCB7A; --focus: #FFA9C0;
  --up: #FF8496; --up-bg: #55303A; --down: #5FD3A8; --down-bg: #244A3D; --flat: #B9A9B0; --flat-bg: #41364A;
  --warn: #FFCB7A; --warn-bg: #4E4026; --danger: #FF9A8C; --danger-bg: #55302C; --ok: #5FD3A8; --ok-bg: #244A3D;
  --cat-1: #E65F93; --cat-2: #4396DB; --cat-3: #C2841E; --cat-4: #8F70E0;
  --chart-grid: #45384F; --chart-axis: #B5A0AC; --chart-surface: #362C40;
  --div-up-3: #FF7387; --div-up-2: #B5505F; --div-up-1: #6E3A46; --div-0: #473C50; --div-down-1: #2F5A4B; --div-down-2: #3B8E72; --div-down-3: #5FD3A8; --div-na: #3A3043;
  --radar-fill: rgba(255, 143, 176, 0.28); --radar-line: #FF8FB0;
  color-scheme: dark;
}
/* ==== src/ui/css/base.css ==== */
/* 版面骨架與共用元件（worker F1）。所有顏色只用 tokens.css 的變數。
   Kawaii 風格：粉彩底、圓角、3px 粗淺色邊框、偏色柔和陰影；資料表與數字保持清楚好讀。 */

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

html {
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  scroll-padding-top: 76px;
}
body {
  margin: 0;
  font-family: var(--font);
  font-size: var(--fs-md);
  line-height: 1.6;
  color: var(--fg);
  background-color: var(--bg);
  background-image: radial-gradient(var(--bg-dot) 1.6px, transparent 1.8px);
  background-size: 22px 22px;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { margin: 0 0 var(--gap-xs); line-height: 1.35; font-weight: 800; color: var(--fg); }
h2 { font-size: var(--fs-lg); }
h3 { font-size: 1.08rem; }
p { margin: 0 0 var(--gap-sm); }
a { color: var(--pink-strong); text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img, svg { max-width: 100%; }
table { border-collapse: collapse; }

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

.sr-only {
  position: absolute !important;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ---------- 外層與頁首 ---------- */
#app {
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  min-width: 0;
}
@media (min-width: 900px) { #app { padding-left: 24px; padding-right: 24px; } }

#app-header {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto auto;
  grid-template-areas: "mascot brand badge btn" "search search search search";
  align-items: center;
  column-gap: var(--gap-md);
  row-gap: var(--gap-sm);
  padding: calc(14px + env(safe-area-inset-top, 0px)) 0 8px;
}
#app-header .mascot { grid-area: mascot; width: 68px; height: 68px; flex: none; }
#app-header .brand { grid-area: brand; min-width: 0; }
#app-header h1 { font-size: var(--fs-xl); margin: 0; letter-spacing: 0.02em; }
#app-header .tagline { margin: 0; font-size: var(--fs-sm); color: var(--fg-soft); }
#data-badge {
  grid-area: badge;
  justify-self: end;
  display: inline-block;
  padding: 6px 14px;
  font-size: var(--fs-sm);
  font-weight: 700;
  color: var(--fg-soft);
  background: var(--card-mint);
  border: var(--border-w) solid var(--edge-mint);
  border-radius: var(--r-pill);
}
#btn-data { grid-area: btn; }
#stock-search-wrap { grid-area: search; position: relative; z-index: 30; width: min(100%, 420px); min-width: 0; }
#stock-search { width: 100%; max-width: 100%; box-sizing: border-box; }
#stock-search-list {
  position: absolute; left: 0; right: 0; top: calc(100% + 6px);
  margin: 0; padding: 6px; list-style: none;
  max-height: min(60vh, 420px); overflow-y: auto;
  background: var(--card); color: var(--fg);
  border: var(--border-w) solid var(--edge-strong);
  border-radius: var(--r-md);
  box-shadow: 0 8px 24px var(--shadow-strong);
}
#stock-search-list[hidden] { display: none; }
.search-item {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  min-height: 40px; padding: 8px 12px; box-sizing: border-box;
  border-radius: var(--r-sm); cursor: pointer; min-width: 0;
}
.search-item:hover, .search-item.is-active { background: var(--card-pink); }
.search-item.is-active { outline: 2px solid var(--focus); outline-offset: -2px; }
.search-item .si-code { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 700; flex: none; }
.search-item .si-name { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.search-item .si-market { margin-left: auto; font-size: var(--fs-xs); color: var(--fg-soft); flex: none; }
.search-empty { padding: 10px 12px; color: var(--fg-soft); }
#glossary-back { margin-bottom: var(--gap-sm); }
#glossary-back[hidden] { display: none; }
@media (max-width: 720px) {
  #app-header {
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-areas: "mascot brand btn" "badge badge badge" "search search search";
  }
  #app-header .mascot { width: 54px; height: 54px; }
  #app-header h1 { font-size: 1.35rem; }
  #data-badge { justify-self: stretch; text-align: center; font-size: var(--fs-xs); padding: 6px 10px; }
}

.mascot { display: block; overflow: visible; animation: mascot-bob 3.6s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes mascot-bob {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-4px) rotate(2deg); }
}

/* ---------- 分頁 ---------- */
#tabs {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  display: flex;
  gap: 6px;
  padding: 8px 8px 10px;
  margin: 0 -8px;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
  background: var(--bg);
  border-bottom: 3px dotted var(--edge);
}
#tabs::-webkit-scrollbar { display: none; }
#tabs [role="tab"] {
  flex: 1 1 auto;
  min-height: 44px;
  padding: 0 12px;
  white-space: nowrap;
  font-weight: 700;
  font-size: 0.95rem;
  color: var(--fg-soft);
  background: var(--card);
  border: var(--border-w) solid var(--edge);
  border-radius: var(--r-pill);
  transition: transform 0.15s ease, background-color 0.15s ease;
}
#tabs [role="tab"]:hover { transform: scale(1.04); background: var(--card-pink); }
#tabs [role="tab"][aria-selected="true"] {
  color: var(--on-accent);
  background: var(--pink);
  border-color: var(--edge-strong);
  box-shadow: 0 4px 12px var(--shadow-strong);
}
#tabs [role="tab"]:focus-visible { outline-offset: -3px; }
#watch-count {
  display: inline-block;
  min-width: 1.6em;
  margin-left: 4px;
  padding: 0 6px;
  font-family: var(--font-num);
  font-size: var(--fs-xs);
  font-weight: 800;
  line-height: 1.6;
  text-align: center;
  color: var(--pink-strong);
  background: var(--card);
  border: 2px solid var(--edge-strong);
  border-radius: var(--r-pill);
}
#tabs [aria-selected="true"] #watch-count { color: var(--on-accent); }
@media (max-width: 480px) {
  #tabs { gap: 4px; }
  #tabs [role="tab"] { padding: 0 8px; font-size: 0.9rem; }
}

/* ---------- 主區域 ---------- */
main { min-width: 0; padding: var(--gap-md) 0 var(--gap-lg); min-height: 50vh; }
main > section { display: flex; flex-direction: column; gap: var(--gap-md); min-width: 0; }
main > section > * { min-width: 0; }

#loading, #empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--gap-sm);
  margin: var(--gap-lg) auto;
  padding: var(--gap-xl) var(--gap-md);
  max-width: 560px;
  text-align: center;
  background: var(--card-pink);
  border: var(--border-w) solid var(--edge-strong);
  border-radius: var(--r-lg);
  box-shadow: 0 8px 22px var(--shadow);
}
#loading .mascot, #empty-state .mascot { width: 96px; height: 96px; }
#loading p, #empty-state p { margin: 0; }
.loading-title { font-size: var(--fs-lg); font-weight: 800; }
.loading-dots { display: inline-flex; gap: 8px; margin-top: 4px; }
.loading-dots i {
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--pink);
  border: 2px solid var(--edge-strong);
  animation: dot-hop 1s ease-in-out infinite;
}
.loading-dots i:nth-child(2) { animation-delay: 0.15s; background: var(--orange); }
.loading-dots i:nth-child(3) { animation-delay: 0.3s; background: var(--card-lilac); }
@keyframes dot-hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-9px); } }

#disclaimer {
  margin: var(--gap-md) 0 calc(var(--gap-lg) + env(safe-area-inset-bottom, 0px));
  padding: var(--gap-sm) var(--gap-md);
  font-size: var(--fs-xs);
  line-height: 1.7;
  text-align: center;
  color: var(--muted);
  background: var(--card-cream);
  border: var(--border-w) dashed var(--edge-cream);
  border-radius: var(--r-md);
}

/* ---------- 共用元件 ---------- */
.card {
  background: var(--card);
  border: var(--border-w) solid var(--edge);
  border-radius: var(--r-lg);
  box-shadow: 0 6px 18px var(--shadow);
  padding: var(--gap-md);
  min-width: 0;
}
@media (min-width: 720px) { .card { padding: 20px; } }
.card.pink { background: var(--card-pink); border-color: var(--edge-strong); }
.card.mint { background: var(--card-mint); border-color: var(--edge-mint); }
.card.cream { background: var(--card-cream); border-color: var(--edge-cream); }
.card.sky { background: var(--card-sky); border-color: var(--edge-sky); }
.card.lilac { background: var(--card-lilac); border-color: var(--edge-lilac); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 40px;
  padding: 0 18px;
  font-weight: 700;
  font-size: var(--fs-md);
  line-height: 1.2;
  text-decoration: none;
  white-space: nowrap;
  color: var(--fg);
  background: var(--card);
  border: var(--border-w) solid var(--edge-strong);
  border-radius: var(--r-pill);
  box-shadow: 0 3px 0 var(--shadow);
  transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
}
.btn:hover:not(:disabled) { transform: scale(1.04); }
.btn:active:not(:disabled) { transform: scale(0.97); box-shadow: 0 1px 0 var(--shadow); }
.btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.btn:disabled, .btn[aria-disabled="true"] { opacity: 0.55; cursor: not-allowed; box-shadow: none; }
.btn-primary { color: var(--on-accent); background: var(--pink); border-color: var(--edge-strong); }
.btn-soft { color: var(--on-accent); background: var(--orange); border-color: var(--edge-cream); }
.btn-ghost { background: transparent; box-shadow: none; border-color: var(--edge-strong); }
.btn-ghost:hover:not(:disabled) { background: var(--card-pink); }
.btn-sm { min-height: 32px; padding: 0 12px; font-size: var(--fs-sm); border-width: 2px; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 28px;
  padding: 2px 12px;
  font-size: var(--fs-sm);
  font-weight: 700;
  line-height: 1.3;
  color: var(--fg-soft);
  background: var(--card-lilac);
  border: 2px solid var(--edge-lilac);
  border-radius: var(--r-pill);
}
.chip.on { color: var(--on-accent); background: var(--pink); border-color: var(--edge-strong); }
.chip.warn { color: var(--warn); background: var(--warn-bg); border-color: var(--edge-cream); }

.badge {
  display: inline-flex;
  align-items: center;
  padding: 0 8px;
  font-size: var(--fs-xs);
  font-weight: 800;
  line-height: 1.6;
  white-space: nowrap;
  color: var(--fg-soft);
  background: var(--flat-bg);
  border-radius: var(--r-pill);
}
.badge.up { color: var(--up); background: var(--up-bg); }
.badge.down { color: var(--down); background: var(--down-bg); }
.badge.flat { color: var(--flat); background: var(--flat-bg); }
.badge.warn { color: var(--warn); background: var(--warn-bg); }

.up { color: var(--up); }
.down { color: var(--down); }
.flat { color: var(--flat); }

.num {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  text-align: right;
}
.muted { color: var(--muted); }
.soft { color: var(--fg-soft); }

.tile {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 12px 16px;
  min-width: 0;
  background: var(--card);
  border: var(--border-w) solid var(--edge);
  border-radius: var(--r-md);
  box-shadow: 0 4px 12px var(--shadow);
}
.tile-label { font-size: var(--fs-sm); font-weight: 700; color: var(--fg-soft); }
.tile-value { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: var(--fs-xl); font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
.tile-sub { font-size: var(--fs-xs); color: var(--muted); }

/* 資料表 */
.table-wrap {
  overflow: auto;
  max-width: 100%;
  max-height: 75vh;
  background: var(--card);
  border: var(--border-w) solid var(--edge);
  border-radius: var(--r-md);
  -webkit-overflow-scrolling: touch;
}
.table-wrap.free { max-height: none; }
.table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 0.92rem;
}
.table th, .table td {
  padding: 6px 10px;
  text-align: left;
  vertical-align: middle;
  border-bottom: 1px solid var(--edge);
}
.table th.num, .table td.num { text-align: right; }
.table thead th {
  position: sticky;
  top: 0;
  z-index: 2;
  height: 44px;
  font-size: var(--fs-sm);
  font-weight: 800;
  white-space: nowrap;
  color: var(--fg-soft);
  background: var(--card-pink);
  border-bottom: var(--border-w) solid var(--edge-strong);
}
.table tbody tr { height: 40px; }
.table tbody tr:nth-child(even) { background: var(--well); }
.table tbody tr:hover { background: var(--card-pink); }
.table tbody tr:last-child td { border-bottom: 0; }
.table tbody tr:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
.table th[aria-sort] { color: var(--pink-strong); }

/* 表單 */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .field-label { font-size: var(--fs-sm); font-weight: 700; color: var(--fg-soft); }
.input, .select {
  width: 100%;
  min-height: 40px;
  padding: 6px 14px;
  font-size: var(--fs-md);
  color: var(--fg);
  background: var(--well);
  border: var(--border-w) solid var(--edge-strong);
  border-radius: var(--r-md);
  transition: border-color 0.15s ease;
}
.input::placeholder { color: var(--muted); opacity: 1; }
.input:hover, .select:hover { border-color: var(--pink); }
.input:focus-visible, .select:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
.select { padding-right: 8px; }
.select[multiple] { padding: 6px 8px; }
input[type="checkbox"], input[type="radio"] { accent-color: var(--pink-strong); width: 1.15rem; height: 1.15rem; }
input[type="range"] { accent-color: var(--pink-strong); }

/* 名詞小問號 */
.term {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 26px;
  height: 26px;
  padding: 0 6px;
  margin: 0 2px;
  vertical-align: middle;
  font-size: 0.8rem;
  font-weight: 800;
  line-height: 1;
  color: var(--pink-strong);
  background: var(--card-lilac);
  border: 2px solid var(--edge-lilac);
  border-radius: var(--r-pill);
  transition: transform 0.15s ease, background-color 0.15s ease;
}
.term:hover { transform: scale(1.15); background: var(--card-pink); }

/* 版面輔助 */
.row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--gap-sm); min-width: 0; }
.stack { display: flex; flex-direction: column; gap: var(--gap-md); min-width: 0; }
.spacer { flex: 1 1 auto; }
.grid-2, .grid-3, .grid-auto { display: grid; gap: var(--gap-md); min-width: 0; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-auto { grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); }
.grid-2 > *, .grid-3 > *, .grid-auto > * { min-width: 0; }
@media (max-width: 960px) { .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 720px) { .grid-2, .grid-3 { grid-template-columns: minmax(0, 1fr); } }

.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--gap-xs);
  padding: var(--gap-lg) var(--gap-md);
  text-align: center;
  color: var(--fg-soft);
  background: var(--card-cream);
  border: var(--border-w) dashed var(--edge-cream);
  border-radius: var(--r-lg);
}
.empty > :first-child { font-size: 2rem; line-height: 1.2; }
.empty p { margin: 0; }

/* ---------- 提示訊息 ---------- */
#toast {
  position: fixed;
  left: 50%;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  z-index: 100;
  max-width: calc(100vw - 32px);
  padding: 10px 20px;
  font-weight: 700;
  text-align: center;
  color: var(--fg);
  background: var(--card);
  border: var(--border-w) solid var(--edge-strong);
  border-radius: var(--r-pill);
  box-shadow: 0 8px 24px var(--shadow-strong);
  transform: translateX(-50%);
  animation: toast-pop 0.25s ease-out;
  pointer-events: none;
}
@keyframes toast-pop {
  from { opacity: 0; transform: translate(-50%, 12px) scale(0.95); }
  to { opacity: 1; transform: translate(-50%, 0) scale(1); }
}

/* ---------- 資料面板 ---------- */
body.has-modal { overflow: hidden; }
#data-scrim {
  position: fixed;
  inset: 0;
  z-index: 69;
  background: var(--scrim);
}
#data-panel {
  position: fixed;
  top: 50%;
  left: 50%;
  z-index: 70;
  width: min(580px, calc(100vw - 32px));
  max-height: calc(100vh - 32px);
  max-height: calc(100dvh - 32px);
  overflow: auto;
  padding: 20px;
  transform: translate(-50%, -50%);
  background: var(--card);
  border: var(--border-w) solid var(--edge-strong);
  border-radius: var(--r-lg);
  box-shadow: 0 14px 40px var(--shadow-strong);
}
#data-panel .panel-head { display: flex; align-items: center; gap: var(--gap-sm); margin-bottom: var(--gap-sm); }
#data-panel .panel-head h2 { flex: 1 1 auto; margin: 0; }
.data-facts {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr);
  gap: 4px var(--gap-md);
  margin: 0 0 var(--gap-md);
  padding: var(--gap-sm) var(--gap-md);
  font-size: var(--fs-sm);
  background: var(--well);
  border: 2px solid var(--edge);
  border-radius: var(--r-md);
}
.data-facts dt { color: var(--fg-soft); font-weight: 700; }
.data-facts dd { margin: 0; font-family: var(--font-num); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
#data-warnings { margin-bottom: var(--gap-md); font-size: var(--fs-sm); }
#data-warnings h3 { font-size: var(--fs-md); }
#data-warnings ul { margin: 0; padding-left: 1.2em; }
#data-warnings li { color: var(--warn); }
#update-box { display: flex; flex-direction: column; gap: var(--gap-sm); margin-bottom: var(--gap-md); }
#update-box .row > .field { flex: 1 1 200px; }
#update-message:empty { display: none; }
#update-message { margin: 0; font-size: var(--fs-sm); min-height: 1.5em; color: var(--fg-soft); }
#update-message.is-error { color: var(--danger); font-weight: 700; }
#update-hint { margin: 0; font-weight: 700; color: var(--fg-soft); }
#data-sources { margin: 0; font-size: var(--fs-xs); line-height: 1.7; color: var(--muted); }
progress {
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
  height: 16px;
  overflow: hidden;
  border: 0;
  border-radius: var(--r-pill);
  background: var(--well);
  outline: 3px solid var(--edge-strong);
  outline-offset: -3px;
}
progress::-webkit-progress-bar { background: var(--well); }
progress::-webkit-progress-value { background: var(--pink); border-radius: var(--r-pill); transition: width 0.2s ease; }
progress::-moz-progress-bar { background: var(--pink); border-radius: var(--r-pill); }

/* ---------- 小辭典 ---------- */
#view-glossary .glossary-head { display: flex; flex-direction: column; gap: var(--gap-sm); }
#view-glossary .glossary-head p { margin: 0; color: var(--fg-soft); }
#glossary-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: var(--gap-md); align-items: start; }
.term-card { scroll-margin-top: 84px; transition: transform 0.15s ease, box-shadow 0.15s ease; }
.term-card:hover { transform: translateY(-2px); }
.term-card:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.term-card h3 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; margin-bottom: var(--gap-sm); font-size: 1.12rem; }
.term-card h3 small { font-size: var(--fs-xs); font-weight: 700; color: var(--muted); }
.term-card .term-group { margin-left: auto; font-size: var(--fs-xs); min-height: 0; padding: 0 10px; }
.term-card p { margin: 0 0 var(--gap-sm); line-height: 1.75; }
.term-card p:last-child { margin-bottom: 0; }
.term-card .term-tag {
  display: inline-block;
  margin-right: 6px;
  padding: 0 10px;
  font-size: var(--fs-xs);
  font-weight: 800;
  color: var(--on-accent);
  background: var(--orange);
  border-radius: var(--r-pill);
}
.term-card .term-read .term-tag { background: var(--pink); }
.term-card.is-focus {
  border-color: var(--pink-strong);
  box-shadow: 0 0 0 5px var(--shadow-strong), 0 10px 24px var(--shadow-strong);
  animation: card-wiggle 0.6s ease-out;
}
@keyframes card-wiggle {
  0% { transform: scale(0.97); }
  50% { transform: scale(1.025); }
  100% { transform: scale(1); }
}

/* ---------- 無動畫偏好 ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
  .btn:hover:not(:disabled), #tabs [role="tab"]:hover, .term:hover, .term-card:hover { transform: none; }
}
/* ==== src/ui/css/screen.css ==== */
/* 選股檢視專屬樣式（#view-screen）。顏色一律取自 tokens.css；共用元件（.card .btn .chip .table …）在 base.css。 */

.screen-root { display: flex; flex-direction: column; gap: var(--gap-lg); min-width: 0; max-width: 100%; }
.screen-root > * { min-width: 0; }
.screen-root .sv-title { margin: 0; font-size: var(--fs-lg); font-weight: 800; color: var(--fg); }
.screen-root .sv-lead { margin: var(--gap-xs) 0 var(--gap-md); }
.screen-root .sv-section > .sv-title { margin-bottom: var(--gap-sm); }

/* ---------- 問精靈 ---------- */
.nlq-row { display: flex; flex-wrap: wrap; gap: var(--gap-sm); align-items: stretch; }
.nlq-input {
  flex: 1 1 260px; min-width: 0; min-height: 56px; box-sizing: border-box;
  padding: 12px 22px; font: inherit; font-size: 1.2rem; color: var(--fg);
  background: var(--card); border: var(--border-w) solid var(--edge-strong); border-radius: var(--r-pill);
}
.nlq-input::placeholder { color: var(--muted); font-size: 1rem; }
.nlq-input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.nlq-submit { flex: 0 0 auto; min-height: 56px; padding-inline: 28px; font-size: 1.1rem; }
.nlq-explain { display: flex; flex-wrap: wrap; gap: var(--gap-xs); margin-top: var(--gap-sm); }
.nlq-explain:empty { display: none; }
.nlq-unknown {
  margin: var(--gap-sm) 0 0; padding: 6px 14px; border-radius: var(--r-md);
  background: var(--warn-bg); color: var(--warn); font-weight: 700;
}
.nlq-examples { display: flex; flex-wrap: wrap; gap: var(--gap-xs); align-items: center; margin-top: var(--gap-md); }
.nlq-examples-label { font-size: var(--fs-sm); }
.nlq-chip { max-width: 100%; height: auto; padding-block: 6px; white-space: normal; text-align: left; line-height: 1.35; }

/* 看不懂就先問 */
.nlq-confirm {
  margin: var(--gap-sm) 0 0; padding: 10px 14px; border-radius: var(--r-md);
  background: var(--warn-bg); color: var(--fg); border: 2px solid var(--warn);
  display: flex; flex-wrap: wrap; gap: var(--gap-sm); align-items: center;
}
.nlq-confirm[hidden] { display: none; }
.nlq-confirm-text { flex: 1 1 260px; min-width: 0; margin: 0; font-weight: 700; overflow-wrap: anywhere; }
.nlq-confirm-actions { display: flex; flex-wrap: wrap; gap: var(--gap-sm); }

/* ---------- 六位精靈 ---------- */
.wizards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 175px), 1fr)); gap: var(--gap-md); }
.wizard-card {
  position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
  min-width: 0; padding: 16px 16px 14px; font: inherit; text-align: left; color: var(--fg); cursor: pointer;
  border: var(--border-w) solid var(--edge-strong); border-radius: var(--r-lg);
  box-shadow: 0 6px 16px var(--shadow);
}
.wizard-card.w-pink { background: var(--card-pink); border-color: var(--edge-strong); }
.wizard-card.w-mint { background: var(--card-mint); border-color: var(--edge-mint); }
.wizard-card.w-cream { background: var(--card-cream); border-color: var(--edge-cream); }
.wizard-card.w-sky { background: var(--card-sky); border-color: var(--edge-sky); }
.wizard-card.w-lilac { background: var(--card-lilac); border-color: var(--edge-lilac); }
.wizard-card.w-peach { background: color-mix(in srgb, var(--orange) 24%, var(--card)); border-color: var(--orange); }
.wizard-card:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.wizard-card.on { border-color: var(--pink-strong); box-shadow: 0 0 0 3px var(--pink-strong), 0 8px 20px var(--shadow-strong); }
.wizard-icon { font-size: 1.7rem; line-height: 1; }
.wizard-name { font-size: var(--fs-lg); font-weight: 800; }
.wizard-tag { font-size: var(--fs-sm); color: var(--fg-soft); line-height: 1.45; flex: 1 1 auto; }
.wizard-count { margin-top: 6px; font-size: var(--fs-sm); color: var(--fg-soft); }
.wizard-count .wizard-n { font-size: var(--fs-xl); font-weight: 800; color: var(--fg); margin-right: 2px; }
.wizard-on {
  display: none; position: absolute; top: 10px; right: 10px; padding: 2px 10px; border-radius: var(--r-pill);
  font-size: var(--fs-xs); font-weight: 800; background: var(--pink-strong); color: var(--card);
}
.wizard-card.on .wizard-on { display: inline-block; }

/* ---------- 我的策略 ---------- */
.saved-strategies { display: flex; flex-wrap: wrap; gap: var(--gap-sm); align-items: center; margin-top: var(--gap-md); }
.saved-strategies[hidden] { display: none; }
.saved-title { font-weight: 800; color: var(--fg-soft); }
.saved-strategy {
  display: inline-flex; align-items: center; max-width: 100%;
  background: var(--card-lilac); border: 2px solid var(--edge-lilac); border-radius: var(--r-pill);
}
.strategy-apply, .strategy-remove {
  font: inherit; color: var(--fg); background: transparent; border: 0; cursor: pointer; min-height: 38px;
}
.strategy-apply { display: inline-flex; gap: 8px; align-items: baseline; padding: 4px 6px 4px 16px; border-radius: var(--r-pill); min-width: 0; }
.strategy-name { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 14em; }
.strategy-meta { font-size: var(--fs-xs); white-space: nowrap; }
.strategy-remove { padding: 4px 14px 4px 8px; border-radius: var(--r-pill); color: var(--fg-soft); font-weight: 700; }
.strategy-remove.confirm { background: var(--danger-bg); color: var(--danger); }
.strategy-apply:focus-visible, .strategy-remove:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }

/* ---------- 條件列 ---------- */
.cond-head { align-items: center; gap: var(--gap-sm); flex-wrap: wrap; }
.cond-list { display: flex; flex-wrap: wrap; gap: var(--gap-sm); margin-top: var(--gap-md); }
.cond-none { margin: 0; }
.cond-chip {
  display: inline-flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; max-width: 100%;
  padding: 4px 4px 4px 14px; background: var(--card); border: 2px solid var(--edge-sky); border-radius: var(--r-pill);
}
.cond-text { font-weight: 800; }
.cond-pass { font-size: var(--fs-xs); color: var(--fg-soft); background: var(--well); padding: 2px 10px; border-radius: var(--r-pill); }
.cond-chip[data-pass="0"] { background: var(--warn-bg); border-color: var(--warn); }
.cond-chip[data-pass="0"] .cond-pass { background: transparent; color: var(--warn); font-weight: 800; }
.cond-remove {
  width: 32px; height: 32px; padding: 0; font: inherit; line-height: 1; cursor: pointer;
  color: var(--fg-soft); background: var(--well); border: 0; border-radius: 50%;
}
.cond-remove:hover { background: var(--down-bg); color: var(--fg); }
.cond-remove:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }

/* ---------- 條件編輯器 ---------- */
.cond-picker { margin-top: var(--gap-md); padding: var(--gap-md); background: var(--well); border: 3px dashed var(--edge-sky); border-radius: var(--r-lg); }
.cond-picker[hidden] { display: none; }
.cond-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: var(--gap-md); align-items: start; }
.cond-picker .field { min-width: 0; }
.cond-picker label, .cond-enum-title { display: block; margin-bottom: 4px; font-weight: 800; font-size: var(--fs-sm); }
.cond-nowrap { flex-wrap: nowrap; align-items: center; gap: var(--gap-xs); }
.cond-picker .select, .cond-picker .input { width: 100%; min-width: 0; box-sizing: border-box; }
.cond-nowrap .term { flex: 0 0 auto; }
.cond-sep, .cond-unit { flex: 0 0 auto; }
.cond-sep[hidden], .cond-picker input[hidden] { display: none; }
.cond-enum { display: flex; flex-wrap: wrap; gap: var(--gap-xs); max-height: 220px; overflow-y: auto; padding: 2px; }
.cond-enum-opt {
  display: inline-flex; align-items: center; gap: 6px; margin: 0; padding: 4px 12px; min-height: 36px;
  font-weight: 700; cursor: pointer; background: var(--card); border: 2px solid var(--edge); border-radius: var(--r-pill);
}
.cond-enum-opt:has(input:checked) { background: var(--card-pink); border-color: var(--pink-strong); }
.cond-enum-opt:focus-within { outline: 3px solid var(--focus); outline-offset: 1px; }
.cond-hint { margin: var(--gap-sm) 0 0; font-size: var(--fs-sm); }
.cond-hint:empty { display: none; }
.cond-error {
  margin: var(--gap-sm) 0; padding: 8px 14px; border-radius: var(--r-md);
  background: var(--danger-bg); color: var(--danger); font-weight: 700;
}
.cond-error[hidden] { display: none; }
.cond-picker > .row { margin-top: var(--gap-sm); gap: var(--gap-sm); }

/* ---------- 結果摘要 ---------- */
.summary-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--gap-sm) var(--gap-md); }
.summary-text { margin: 0; font-size: var(--fs-lg); font-weight: 700; }
.summary-n { font-size: var(--fs-xxl); font-weight: 800; margin-inline: 2px; }
.summary-limit { font-size: var(--fs-sm); font-weight: 400; }
.summary-sort { display: flex; flex-wrap: wrap; align-items: center; gap: var(--gap-xs); }
.summary-sort .select { max-width: 100%; }
.summary-actions { display: flex; flex-wrap: wrap; gap: var(--gap-sm); margin-top: var(--gap-sm); }
.strategy-form { display: flex; flex-wrap: wrap; align-items: center; gap: var(--gap-sm); margin-top: var(--gap-sm); }
.strategy-form[hidden] { display: none; }
.strategy-form .input { flex: 1 1 200px; min-width: 0; }
.strategy-form .cond-error { flex: 1 1 100%; margin: 0; }
.copy-fallback-wrap { margin-top: var(--gap-sm); }
.copy-fallback-wrap[hidden] { display: none; }
.copy-fallback { width: 100%; box-sizing: border-box; font-family: var(--font-num); font-size: var(--fs-sm); color: var(--fg); background: var(--card); border: 2px solid var(--edge); border-radius: var(--r-md); padding: 8px; }

/* ---------- 結果表 ---------- */
.result-section { min-width: 0; }
.result-section .table-wrap[hidden], .result-empty[hidden] { display: none; }
.result-table th, .result-table td { white-space: nowrap; }
.result-table th.num { text-align: right; }
.result-table th .term { margin-left: 2px; vertical-align: middle; }
.sort-btn {
  display: inline-flex; align-items: center; gap: 3px; padding: 4px 2px; font: inherit; font-weight: 800;
  color: inherit; background: transparent; border: 0; border-radius: var(--r-sm); cursor: pointer;
}
.sort-btn:hover { color: var(--pink-strong); }
.sort-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
.sort-ind { display: inline-block; min-width: 0.9em; font-size: var(--fs-xs); color: var(--pink-strong); }
.result-row { cursor: pointer; }
.result-row:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
.cell-watch { width: 48px; }
.watch-toggle {
  width: 36px; height: 36px; padding: 0; font-size: 1.25rem; line-height: 1; cursor: pointer;
  color: var(--muted); background: transparent; border: 0; border-radius: 50%;
}
.watch-toggle:hover { background: var(--well); }
.watch-toggle[aria-pressed="true"] { color: var(--orange-strong); }
.watch-toggle:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
.cell-code { font-weight: 800; margin-right: 2px; text-align: left; }
.cell-name { color: var(--fg); }
.cell-stock .badge { margin-left: 6px; }
.idle-badge { font-weight: 700; }
.cond-enum-mode { margin-bottom: var(--gap-sm); }

/* ==== src/ui/css/charts.css ==== */
/* 圖表樣式（TW.charts）。顏色只用 tokens.css 的變數；文字不用序列色，格線與軸線安靜。 */
.chart { position: relative; width: 100%; min-width: 0; max-width: 100%; color: var(--fg); }
.chart-svg {
  display: block; width: 100%; max-width: 100%; overflow: visible;
  touch-action: pan-y; -webkit-tap-highlight-color: transparent;
  font-family: var(--font-num);
}
.chart-svg:focus { outline: none; }
.chart-svg:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: var(--r-sm); }

/* 文字 */
.chart-svg text { font-size: 12px; fill: var(--chart-axis); font-family: var(--font-num); }
.chart-svg .ax-y { text-anchor: start; font-variant-numeric: tabular-nums; }
.chart-svg .ax-y.ax-left { text-anchor: end; }
.chart-svg .ax-y.ax-name { fill: var(--muted); }
.chart-svg .ax-x { text-anchor: middle; }
.chart-svg .ax-title { fill: var(--fg-soft); font-size: 12px; }
.chart-svg .end-label { fill: var(--fg-soft); font-weight: 700; }

/* 格線與軸線（一個層級的淡灰、細實線） */
.chart-svg .grid, .chart-svg .axis, .chart-svg .tick {
  stroke: var(--chart-grid); stroke-width: 1; fill: none; shape-rendering: crispEdges;
}
.chart-svg .axis, .chart-svg .tick { stroke: var(--chart-axis); stroke-opacity: .55; }
.chart-svg .grid.ref { stroke: var(--chart-axis); stroke-opacity: .45; }
.chart-svg .grid.zero, .chart-svg .zero-line { stroke: var(--chart-axis); stroke-opacity: .8; stroke-width: 1.5; }
.chart-svg .baseline { stroke: var(--chart-axis); stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; }
.chart-svg .crosshair { stroke: var(--chart-axis); stroke-width: 1; stroke-opacity: .8; pointer-events: none; shape-rendering: crispEdges; }
.chart-svg .bar-band { fill: var(--chart-grid); opacity: .7; pointer-events: none; }

/* 折線 */
.chart-svg .line, .chart-svg .ma, .chart-svg .ind-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart-svg .ma { stroke-width: 1.6; }
.chart-svg .end-dot, .chart-svg .xdot { stroke: var(--chart-surface); stroke-width: 2; pointer-events: none; }

/* K 線：漲＝紅、跌＝綠（台股慣例；tooltip 與 aria 一律另有文字／▲▼） */
.chart-svg .candle .wick { stroke-width: 1; shape-rendering: crispEdges; }
.chart-svg .candle .body { shape-rendering: crispEdges; }
.chart-svg .candle.up .wick { stroke: var(--up); }   .chart-svg .candle.up .body { fill: var(--up); }
.chart-svg .candle.down .wick { stroke: var(--down); } .chart-svg .candle.down .body { fill: var(--down); }
.chart-svg .candle.flat .wick { stroke: var(--flat); } .chart-svg .candle.flat .body { fill: var(--flat); }
.chart-svg .vol, .chart-svg .osc { shape-rendering: crispEdges; opacity: .42; }
.chart-svg .vol.up, .chart-svg .osc.up { fill: var(--up); }
.chart-svg .vol.down, .chart-svg .osc.down { fill: var(--down); }
.chart-svg .vol.flat, .chart-svg .osc.flat { fill: var(--flat); }

/* 長條 */
.chart-svg .bar.pos { fill: var(--up); }
.chart-svg .bar.neg { fill: var(--down); }
.chart-svg .bar.zero { fill: var(--flat); }

/* 雷達 */
.chart-svg .radar-ring, .chart-svg .radar-spoke { stroke: var(--chart-axis); stroke-opacity: .28; stroke-width: 1; fill: none; }
.chart-svg .radar-area { fill: var(--radar-fill); stroke: var(--radar-line); stroke-width: 2; stroke-linejoin: round; }
.chart-svg .radar-dot { fill: var(--radar-line); stroke: var(--chart-surface); stroke-width: 2; pointer-events: none; }
.chart-svg .radar-dot.is-null { fill: var(--chart-surface); stroke: var(--chart-axis); stroke-width: 1.5; }
.chart-svg .radar-dot.on { r: 7; }
.chart-svg .radar-hit { fill: transparent; }
.chart-svg .radar-label { fill: var(--fg-soft); font-weight: 700; }
.chart-svg .radar-label.is-null { fill: var(--muted); font-weight: 400; }

/* 散布圖 */
.chart-svg .grid.v { stroke-opacity: .6; }
.chart-svg .pt.rest { fill: var(--flat); fill-opacity: .32; }
.chart-svg .pt.hit { fill: var(--cat-1); fill-opacity: .88; stroke: var(--chart-surface); stroke-width: 1.5; }
.chart-svg .pt-ring { fill: none; stroke: var(--fg); stroke-width: 2; pointer-events: none; }

/* Treemap */
.chart-svg .tm-rect { stroke: none; }
.chart-svg .tm-cell { cursor: default; outline: none; }
.chart-svg .tm-cell.b-u3 .tm-rect { fill: var(--div-up-3); }
.chart-svg .tm-cell.b-u2 .tm-rect { fill: var(--div-up-2); }
.chart-svg .tm-cell.b-u1 .tm-rect { fill: var(--div-up-1); }
.chart-svg .tm-cell.b-0  .tm-rect { fill: var(--div-0); }
.chart-svg .tm-cell.b-d1 .tm-rect { fill: var(--div-down-1); }
.chart-svg .tm-cell.b-d2 .tm-rect { fill: var(--div-down-2); }
.chart-svg .tm-cell.b-d3 .tm-rect { fill: var(--div-down-3); }
.chart-svg .tm-cell.b-na .tm-rect { fill: var(--div-na); }
.chart-svg .tm-cell:hover .tm-rect, .chart-svg .tm-cell:focus .tm-rect { stroke: var(--fg); stroke-width: 2; }
.chart-svg .tm-cell:focus-visible .tm-rect { stroke: var(--focus); stroke-width: 3; }
.chart-svg .tm-label { font-size: 12.5px; font-weight: 800; font-family: var(--font); pointer-events: none; }
.chart-svg .tm-metric { font-size: 11px; font-weight: 700; pointer-events: none; font-variant-numeric: tabular-nums; }

.tm-legend {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
  margin: 12px 0 26px; font-size: var(--fs-xs); color: var(--fg-soft);
}
.tm-leg-bar { position: relative; display: block; height: 14px; max-width: 100%; }
.tm-leg-sw { display: flex; height: 14px; }
.tm-sw { display: inline-block; flex: 1 1 0; height: 14px; }
.tm-leg-sw .tm-sw:first-child { border-radius: 7px 0 0 7px; }
.tm-leg-sw .tm-sw:last-child { border-radius: 0 7px 7px 0; }
.tm-leg-na { display: inline-flex; align-items: center; gap: 4px; }
.tm-leg-na .tm-sw { flex: none; width: 14px; border-radius: 4px; border: 1px solid var(--chart-grid); }
.tm-sw.b-u3 { background: var(--div-up-3); } .tm-sw.b-u2 { background: var(--div-up-2); } .tm-sw.b-u1 { background: var(--div-up-1); }
.tm-sw.b-0 { background: var(--div-0); }
.tm-sw.b-d1 { background: var(--div-down-1); } .tm-sw.b-d2 { background: var(--div-down-2); } .tm-sw.b-d3 { background: var(--div-down-3); }
.tm-sw.b-na { background: var(--div-na); }
.tm-leg-end { font-weight: 700; white-space: nowrap; }
.tm-leg-end.up { color: var(--up); } .tm-leg-end.down { color: var(--down); }
.tm-leg-ticks { position: absolute; left: 0; right: 0; top: 17px; height: 14px; pointer-events: none; }
.tm-leg-ticks > span { position: absolute; transform: translateX(-50%); white-space: nowrap; font-size: 11px; color: var(--chart-axis); font-variant-numeric: tabular-nums; }

/* 圖例 */
.chart-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin: 0 0 6px; font-size: var(--fs-sm); color: var(--fg-soft); }
.legend-item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend-key { display: inline-block; flex: none; background: var(--k); }
.legend-key.line { width: 16px; height: 3px; border-radius: 2px; }
.legend-key.box { width: 11px; height: 11px; border-radius: 3px; }
.legend-key.dot { width: 10px; height: 10px; border-radius: 50%; }
.legend-sep { width: 1px; height: 14px; background: var(--chart-grid); }
.legend-name { color: var(--fg-soft); }

/* Tooltip */
.chart-tip {
  position: absolute; z-index: 20; left: 0; top: 0; pointer-events: none;
  min-width: 120px; padding: 8px 12px; border-radius: var(--r-sm);
  background: var(--card); color: var(--fg); border: 2px solid var(--edge-strong);
  box-shadow: 0 6px 18px var(--shadow); font-size: 0.85rem; line-height: 1.45;
}
.chart-tip[hidden] { display: none; }
.chart-tip .tip-title { font-weight: 800; margin-bottom: 4px; color: var(--fg); font-variant-numeric: tabular-nums; }
.chart-tip .tip-row { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.chart-tip .tip-key { flex: none; width: 12px; height: 3px; border-radius: 2px; background: var(--k); }
.chart-tip .tip-key.none { background: transparent; width: 0; }
.chart-tip .tip-label { color: var(--fg-soft); }
.chart-tip .tip-val { margin-left: auto; padding-left: 12px; color: var(--fg); font-family: var(--font-num); font-variant-numeric: tabular-nums; text-align: right; }
.chart-tip .tip-row.strong .tip-val { font-weight: 800; }
.chart-tip .tip-val.up { color: var(--up); }
.chart-tip .tip-val.down { color: var(--down); }
.chart-tip .tip-val.flat { color: var(--flat); }

/* 空資料 */
.chart-empty {
  display: flex; align-items: center; justify-content: center; min-height: 96px; padding: var(--gap-md);
  color: var(--muted); font-size: var(--fs-sm); border: 2px dashed var(--chart-grid); border-radius: var(--r-md); background: var(--well);
}

/* 迷你走勢 */
.spark { display: inline-block; vertical-align: middle; overflow: visible; }

/* 動畫：只在使用者沒有要求減少動態時才有 */
@media (prefers-reduced-motion: no-preference) {
  .chart-svg .tm-rect, .chart-svg .bar, .chart-svg .radar-dot { transition: stroke-width .12s ease, r .12s ease; }
  .chart-svg .radar-area { transition: opacity .2s ease; }
}
@media (prefers-reduced-motion: reduce) {
  .chart-svg *, .chart-tip { transition: none !important; animation: none !important; }
}
/* ==== src/ui/css/detail.css ==== */
/* 個股詳情面板（U8）專屬樣式；顏色只用 tokens.css 的變數，共用元件沿用 base.css */
#detail-scrim {
  position: fixed; inset: 0; z-index: 80;
  background: var(--scrim);
}
#detail-scrim[hidden], #detail[hidden] { display: none; }

#detail {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 81;
  width: min(760px, 100%);
  display: flex; flex-direction: column;
  background: var(--bg);
  color: var(--fg);
  border-left: var(--border-w) solid var(--edge-strong);
  border-radius: var(--r-lg) 0 0 var(--r-lg);

}
#detail.is-open { animation: detail-in 0.24s ease-out; }
@keyframes detail-in {

#detail .detail-actions { display: flex; gap: var(--gap-xs); flex: 0 0 auto; flex-wrap: wrap; justify-content: flex-end; }

#detail .detail-body {

}

@media (max-width: 719px) {

  #detail .detail-head { padding: var(--gap-sm) var(--gap-md); }
  #detail .detail-title { font-size: var(--fs-lg); }
  #detail .detail-body { padding: var(--gap-sm) var(--gap-md) var(--gap-md); }
  #detail .quote-close { font-size: var(--fs-xl); }
  #detail .detail-sec { padding: var(--gap-sm) var(--gap-md); }
  #detail .stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #detail .chart-price { min-height: 380px; }
}
/* ==== src/ui/css/views.css ==== */
/* 市場地圖（#view-map）、回測（#view-backtest）、自選股與比較（#view-watch）專屬樣式。
   顏色一律取自 tokens.css 的變數；共用元件（.card .btn .chip .tile .table …）在 base.css。 */

/* ---------- 三個檢視共用 ---------- */
.map-view, .bt-view, .watch-view { display: flex; flex-direction: column; gap: var(--gap-md); min-width: 0; max-width: 100%; }
.map-view > *, .bt-view > *, .watch-view > * { min-width: 0; }
.view-head { display: flex; flex-direction: column; gap: 2px; }
.view-title { margin: 0; font-size: var(--fs-xl); font-weight: 800; }
.view-head p { margin: 0; }
.card-title { margin: 0 0 var(--gap-xs); font-size: 1.1rem; font-weight: 800; }
.map-lead { margin: 0 0 var(--gap-sm); font-size: var(--fs-sm); line-height: 1.6; }
.map-note { margin: var(--gap-sm) 0 0; font-size: var(--fs-sm); line-height: 1.6; }
.map-chart, .bt-chart, .cmp-chart { position: relative; min-width: 0; max-width: 100%; }
.map-chart .chart-empty, .bt-chart .chart-empty, .cmp-chart .chart-empty {
  padding: var(--gap-lg) var(--gap-md); text-align: center; color: var(--muted);
  background: var(--well); border-radius: var(--r-md);
}
.field-check > label { display: flex; align-items: flex-start; gap: 8px; line-height: 1.5; font-weight: 600; cursor: pointer; }
.field-check input[type="checkbox"] { flex: none; margin-top: 3px; }

/* ---------- 市場地圖 ---------- */
.map-breadth { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gap-sm); }
@media (max-width: 900px) { .map-breadth { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.breadth-note { margin: var(--gap-sm) 0 0; font-size: 0.875rem; }
.map-tile .tile-label { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; }
.map-tile .tile-value { font-size: 1.45rem; }
.map-tile .tile-sub { line-height: 1.4; }

.map-controls { display: flex; flex-wrap: wrap; gap: var(--gap-sm) var(--gap-md); align-items: flex-end; margin-bottom: var(--gap-sm); }
.map-controls .field { flex: 1 1 170px; max-width: 280px; }
@media (max-width: 480px) { .map-controls .field { max-width: none; flex-basis: 100%; } }
.map-crumbbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--gap-sm); margin-bottom: var(--gap-sm); min-height: 32px; }
.map-crumb { font-weight: 800; color: var(--fg-soft); }
.crumb-root {
  padding: 2px 6px; font-weight: 800; color: var(--pink-strong); background: none; border: 0;
  border-radius: var(--r-sm); text-decoration: underline; text-underline-offset: 3px;
}
.map-crumb .crumb-root:only-child { color: var(--fg-soft); text-decoration: none; cursor: default; }
.crumb-now { color: var(--fg); }
.map-toplists-title { margin-bottom: 0; }
.map-view .map-section { display: flex; flex-direction: column; gap: var(--gap-sm); }

.toplist { padding: var(--gap-md); }
.toplist-title { margin: 0 0 var(--gap-sm); font-size: 1.05rem; font-weight: 800; }
.toplist .table-wrap { max-height: none; border-width: 2px; }
.toplist .table th, .toplist .table td { padding: 6px 8px; }
.toplist .table tbody tr { cursor: pointer; }
.toplist .rank { width: 2.2em; color: var(--muted); text-align: center; }
.toplist .tl-name { min-width: 7em; }
.tl-code { font-weight: 800; margin-right: 2px; }

/* ---------- 回測 ---------- */
.bt-steps { margin: var(--gap-xs) 0 var(--gap-sm); padding-left: 1.3em; line-height: 1.8; }
.bt-steps li { margin-bottom: 2px; }
.bt-conds { display: flex; flex-wrap: wrap; gap: var(--gap-xs); margin-bottom: var(--gap-sm); }
.bt-conds .chip { max-width: 100%; white-space: normal; }
.bt-used { display: flex; flex-wrap: wrap; align-items: center; gap: var(--gap-xs); }
.bt-used-label { font-weight: 700; }
.bt-used .chip { max-width: 100%; white-space: normal; }
#bt-result:focus { outline: none; }
#bt-result:focus-visible { outline: 3px solid var(--pink-strong); outline-offset: 4px; border-radius: var(--r-md); }
.bt-nb-msg {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--gap-sm);
  margin-bottom: var(--gap-sm); padding: var(--gap-sm) var(--gap-md);
  color: var(--warn); background: var(--warn-bg); border-radius: var(--r-md); font-weight: 700; line-height: 1.6;
}
.bt-nb-text { flex: 1 1 240px; min-width: 0; }
.bt-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: var(--gap-md); align-items: start; margin-bottom: var(--gap-xs); }
.bt-options .field-check { grid-column: 1 / -1; }
.bt-top-hint { margin: var(--gap-sm) 0 0; font-size: var(--fs-sm); }
@media (max-width: 560px) {
  .bt-view > .view-head > p { display: none; }
  .bt-options { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap-sm); }
  .bt-options .field:first-child { grid-column: 1 / -1; }   /* #bt-step 的選項文字長，窄螢幕獨佔一整列才不會被截斷 */
  .bt-options .select, .bt-options .input { font-size: var(--fs-sm); padding-left: 10px; padding-right: 6px; }
  .bt-options .field label { font-size: var(--fs-sm); line-height: 1.35; }
  .bt-options .field-check label { font-size: var(--fs-sm); font-weight: 600; }
  .bt-setup .bt-nb-msg { padding: var(--gap-xs) var(--gap-sm); font-size: var(--fs-sm); margin-bottom: var(--gap-xs); }
  .bt-conds { margin-bottom: var(--gap-xs); }
}
.bt-actions { margin-top: var(--gap-xs); }
.bt-status { margin: 0; font-weight: 700; color: var(--pink-strong); flex: 1 1 140px; min-width: 0; }
.bt-status[data-state="fail"] { color: var(--warn); }
.bt-stale-msg {
  margin: 0; padding: var(--gap-sm) var(--gap-md); font-weight: 800;
  color: var(--warn); background: var(--warn-bg); border: 2px dashed var(--edge-cream); border-radius: var(--r-md);
}
.bt-result { display: flex; flex-direction: column; gap: var(--gap-md); min-width: 0; }
.bt-result > * { min-width: 0; }
.bt-result.is-stale #bt-stats, .bt-result.is-stale .bt-section, .bt-result.is-stale .bt-settings { opacity: 0.5; filter: saturate(0.6); }
.bt-settings, .bt-note { margin: 0; font-size: var(--fs-sm); line-height: 1.6; }
.bt-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: var(--gap-sm); }
.bt-tile .tile-label { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; }
.bt-tile .tile-value { font-size: 1.4rem; }
.bt-tile .tile-sub { line-height: 1.4; }
.bt-section .table-wrap { max-height: none; }
.bt-section > p { font-size: var(--fs-sm); margin: 0 0 var(--gap-sm); }
.bt-period { cursor: pointer; }
.bt-period .bt-range { white-space: nowrap; }
.bt-period .bt-range::before { content: '▸ '; color: var(--muted); }
.bt-period[aria-expanded="true"] .bt-range::before { content: '▾ '; color: var(--pink-strong); }
.bt-pick-row td { padding: var(--gap-sm) var(--gap-md); background: var(--well); }
.bt-pick-row:hover { background: var(--well) !important; }
.bt-pick-title { margin-bottom: var(--gap-xs); font-size: var(--fs-sm); }
.bt-picks { display: flex; flex-wrap: wrap; gap: var(--gap-xs); max-height: 220px; overflow: auto; }
.bt-pick { cursor: pointer; font-family: inherit; }
.bt-pick:hover { background: var(--card-pink); }
.bt-caveats { border-width: var(--border-w); }
.bt-caveat-list { margin: 0 0 var(--gap-sm); padding-left: 1.3em; line-height: 1.8; }
.bt-never { margin: 0; font-weight: 800; color: var(--warn); }
.bt-fail-msg { margin: 0; font-weight: 700; color: var(--danger); }

/* ---------- 自選股與比較 ---------- */
.watch-hint { margin: 0; font-size: var(--fs-sm); }
.watch-empty .btn { margin-top: var(--gap-sm); }
.watch-empty .empty-icon { font-size: 2.4rem; }
.watch-table-wrap { max-height: none; }
.watch-row { cursor: pointer; }
.watch-row.is-missing { cursor: default; }
.watch-cb { width: 3.2em; text-align: center !important; }
.watch-code { font-weight: 800; margin-right: 2px; text-align: left; }
.watch-name { min-width: 9em; }
.watch-name .badge { margin-left: 2px; }
.watch-missing { color: var(--fg-soft); }
.watch-act { text-align: right !important; white-space: nowrap; }
.watch-spark svg { display: block; width: 96px; height: 28px; }
.watch-factors { display: inline-flex; align-items: flex-end; gap: 3px; height: 28px; }
.wf-bar { position: relative; width: 8px; height: 28px; background: var(--well); border: 1.5px solid var(--edge-strong); border-radius: 4px; overflow: hidden; }
.wf-fill { position: absolute; left: 0; right: 0; bottom: 0; background: var(--cat-1); }
.wf-bar.is-na { border-style: dashed; opacity: 0.6; }

.cmp-panel { display: flex; flex-direction: column; gap: var(--gap-sm); }
.cmp-head { align-items: flex-start; }
.cmp-head p { margin: 0; flex: 1 1 260px; font-size: var(--fs-sm); }
.cmp-ranges { display: flex; flex-wrap: wrap; gap: var(--gap-xs); }
.cmp-range[aria-pressed="true"] { color: var(--on-accent); background: var(--pink); border-color: var(--edge-strong); }
.cmp-note, .cmp-legend { margin: 0; font-size: var(--fs-sm); line-height: 1.6; }
.cmp-table { min-width: 100%; width: max-content; }
.cmp-table .cmp-metric { position: sticky; left: 0; z-index: 1; min-width: 8.5em; white-space: nowrap; background: var(--card); text-align: left; border-right: 2px solid var(--edge); }
.cmp-table thead th.cmp-metric { z-index: 3; background: var(--card-pink); }
.cmp-table tbody tr:nth-child(even) .cmp-metric { background: var(--well); }
.cmp-table tbody tr:hover .cmp-metric { background: var(--card-pink); }
.cmp-table th.cmp-stock { min-width: 7.5em; white-space: normal; line-height: 1.35; }
.cmp-table td.num { white-space: nowrap; }
.cmp-dot { display: inline-block; width: 10px; height: 10px; margin-right: 5px; border-radius: 50%; vertical-align: baseline; }
.cmp-dot.c1 { background: var(--cat-1); }
.cmp-dot.c2 { background: var(--cat-2); }
.cmp-dot.c3 { background: var(--cat-3); }
.cmp-dot.c4 { background: var(--cat-4); }
.cmp-table td.best { font-weight: 800; background: var(--ok-bg); box-shadow: inset 0 0 0 2px var(--edge-mint); }
.cmp-table td.best::before { content: '★ '; color: var(--orange-strong); }
.cmp-panel .table-wrap { max-height: none; }
</style>
</head>

<script>
/* ==== src/core/util.js ==== */
/* 共用小工具（主線撰寫，其他模組都可以依賴；請勿修改簽章）。
 * 瀏覽器：window.TW.util；Node：require('./util.js') 取得同一個物件。 */
(function (root) {
  'use strict';
  var TW = root.TW = root.TW || {};

  var EMPTY = { '': 1, '-': 1, '--': 1, '---': 1, '----': 1, '－': 1, 'N/A': 1, 'NA': 1, 'null': 1, '除權': 1, '除息': 1, '除權息': 1 };

  /** 把交易所的數字字串轉成 number；無法解讀或代表「沒有資料」時回傳 null。
   *  "1,234.50"→1234.5、"+0.18"→0.18、"-0.10 "→-0.1、"12.5%"→12.5、"X0.00"→0、""/"--"/"－"→null。 */
  function parseNum(x) {
    if (x === null || x === undefined) return null;
    if (typeof x === 'number') return isFinite(x) ? x : null;
    var s = String(x).replace(/[\s　,]/g, '').replace(/%$/, '');
    if (EMPTY[s]) return null;
    s = s.replace(/^[Xx]/, '').replace(/^\+/, '');
    if (!/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return null;
    var n = Number(s);
    return isFinite(n) ? n : null;
  }

  function pad2(n) { n = String(n); return n.length < 2 ? '0' + n : n; }

  /** 民國緊湊日期："1151007"→"2026-10-07"；"11508"→"2026-08"（年月）。格式不對回傳 null。 */
  function rocCompactToISO(s) {
    s = String(s === null || s === undefined ? '' : s).trim();
    var m = /^(\d{2,3})(\d{2})(\d{2})$/.exec(s);
    if (m) return (1911 + parseInt(m[1], 10)) + '-' + m[2] + '-' + m[3];
    m = /^(\d{2,3})(\d{2})$/.exec(s);
    if (m) return (1911 + parseInt(m[1], 10)) + '-' + m[2];
    return null;
  }
  /** 民國斜線日期："115/09/01"→"2026-09-01"。 */
  function rocSlashToISO(s) {
    var m = /^\s*(\d{2,3})\/(\d{1,2})\/(\d{1,2})\s*$/.exec(String(s));
    return m ? (1911 + parseInt(m[1], 10)) + '-' + pad2(m[2]) + '-' + pad2(m[3]) : null;
  }
  /** 西元斜線日期："2026/09/01"→"2026-09-01"。 */
  function adSlashToISO(s) {
    var m = /^\s*(\d{4})\/(\d{1,2})\/(\d{1,2})\s*$/.exec(String(s));
    return m ? m[1] + '-' + pad2(m[2]) + '-' + pad2(m[3]) : null;
  }
  /** "20261007"→"2026-10-07"。 */
  function compactToISO(s) {
    var m = /^\s*(\d{4})(\d{2})(\d{2})\s*$/.exec(String(s));
    return m ? m[1] + '-' + m[2] + '-' + m[3] : null;
  }

  // ---------- 其他樣式（連買、排序、筆數、精靈） ----------

  var STREAK_RE1 = new RegExp('(外資|投信)連(?:續)?(?:買超|買)(?:(' + NUMCN + ')[天日])?(?:[ \\t]*以上)?', 'y');

  /** 依 ctx.industries 建立「產業別名 → 名稱陣列」，含去掉工業／業的簡稱與固定簡稱。 */
  function buildIndustryAliases(industries) {

  function parse(text, ctx) {

            if (r && !(si === 1 && c0 === '低' && (r.cond.op === '>' || r.cond.op === '>='))) out.push({ len: r.end - p, ev: { t: 'cond', cond: r.cond } });

    function isTarget(ev) {

  /** 建立一張圖。draw(ctx) 回傳 null（空資料）或 {svg, legend, aria, after(svg, api), interact}。 */
  function makeChart(el, kind, userOpts, defaults, draw, flags) {
    flags = flags || {};
    var inst = { opts: assign({}, defaults, userOpts), el: el, update: function () {}, destroy: function () {} };
    if (!HAS_DOM || !el || typeof el.appendChild !== 'function') return inst;

      if (!res) {

        '<svg class="chart-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H +
        '" style="width:100%;height:' + H + 'px" role="img" tabindex="0" focusable="true" aria-label="' + esc(res.aria) + '">' + res.svg + '</svg>');

        if (it.click) on(st.local, svg, 'click', function (e) { it.click(e); });

  // ---------------------------------------------------------------- K 線
  function drawCandle(ctx) {
    var o = ctx.opts, W = ctx.W, H = Math.max(220, N(o.height, 420));
    var dates = arr(o.dates), n = dates.length;
    var O = arr(o.o), Hh = arr(o.h), L = arr(o.l), C = arr(o.c), V = arr(o.v);
    if (!n) return null;
    var i, j, any = false;

    if (!any) return null;
    var range = isNum(o.range) ? Math.floor(o.range) : 120;
    range = clamp(range < 1 ? 120 : range, 1, n);
    var start = n - range;
    var indKey = (o.indicator === 'rsi' || o.indicator === 'macd') ? o.indicator : 'kd';
    var maList = arr(o.ma).filter(function (m) { return isNum(m) && m >= 1; }).map(Math.floor);
    var vUnit = N(o.vUnit, 1000) > 0 ? N(o.vUnit, 1000) : 1000;

    // 用完整序列算指標（只用有收盤價的日子），再對回原索引
    var IND = root.TW && root.TW.indicators;
    var idx = [], cc = [], hh = [], ll = [];
    for (i = 0; i < n; i++) {

    var mas = maList.map(function (m) { return back(IND ? IND.sma(cc, m) : null); });
    var indDefs = [];
    if (indKey === 'kd') {
      var kd = IND ? IND.kd(hh, ll, cc, 9) : null;
      indDefs = [{ id: 'k', name: 'K 值', color: 'var(--cat-4)', vals: back(kd && kd.k) }, { id: 'd', name: 'D 值', color: 'var(--cat-3)', vals: back(kd && kd.d) }];
    } else if (indKey === 'rsi') {

    } else {
      var mc = IND ? IND.macd(cc, 12, 26, 9) : null;
      indDefs = [{ id: 'dif', name: 'DIF', color: 'var(--cat-4)', vals: back(mc && mc.dif) }, { id: 'signal', name: '訊號線', color: 'var(--cat-3)', vals: back(mc && mc.signal) }];
      indDefs.osc = back(mc && mc.osc);

    // 版面

    var plotW = Math.max(40, W - left - right);

    var priceH = Math.round(avail * 0.56), volH = Math.round(avail * 0.14), indH = Math.round(avail - priceH - volH);
    var priceTop = top, volTop = priceTop + priceH + gap, indTop = volTop + volH + gap, bottom = indTop + indH;
    var slot = plotW / range;
    function xc(k) { return left + (k - start + 0.5) * slot; }
    var bw = Math.max(1, Math.min(slot * 0.72, 14));

    // 價格範圍
    var lo = Infinity, hi = -Infinity, vmax = 0, lastC = null, lastI = -1;
    for (i = start; i < n; i++) {

      var vals4 = [C[i], O[i], Hh[i], L[i]];
      for (j = 0; j < 4; j++) if (isNum(vals4[j])) { if (vals4[j] > hi) hi = vals4[j]; if (vals4[j] < lo) lo = vals4[j]; }
      lastC = C[i]; lastI = i;
    }
    var pLo = lo, pHi = hi;
    mas.forEach(function (m) { for (var q = start; q < n; q++) if (isNum(m[q])) { if (m[q] > hi) hi = m[q]; if (m[q] < lo) lo = m[q]; } });
    if (!isFinite(lo) || !isFinite(hi)) return null;

    var pTicks = niceTicks(d0, d1, 4), pf = tickFmt(pTicks);

    for (i = start; i < n; i++) if (isNum(V[i]) && V[i] / vUnit > vmax) vmax = V[i] / vUnit;
    var vStep = niceStep(vmax || 1, 2), vTop = Math.ceil((vmax || 1) / vStep - 1e-9) * vStep;
    function yv(v) { return volTop + volH - (v / vUnit) / vTop * volH; }

    var yi, iTicks, iRefs = [], iDomain;
    if (indKey === 'macd') {
      var mm = 0;
      indDefs.forEach(function (s) { for (var q = start; q < n; q++) if (isNum(s.vals[q]) && Math.abs(s.vals[q]) > mm) mm = Math.abs(s.vals[q]); });
      for (i = start; i < n; i++) if (isNum(indDefs.osc[i]) && Math.abs(indDefs.osc[i]) > mm) mm = Math.abs(indDefs.osc[i]);
      if (!(mm > 0)) mm = 1;

    var itf = tickFmt(iTicks);
    yi = function (v) { return indTop + (iDomain[1] - v) / (iDomain[1] - iDomain[0]) * indH; };

    var s = '';
    // 價格面板
    s += '<g class="pane pane-price" data-ymin="' + f2(d0) + '" data-ymax="' + f2(d1) + '" data-top="' + priceTop + '" data-bottom="' + (priceTop + priceH) + '">';
    pTicks.forEach(function (t) {

    });
    var cs = '';
    for (i = start; i < n; i++) {

        '"/><rect class="body" x="' + f2(x - bw / 2) + '" y="' + f2(yT) + '" width="' + f2(bw) + '" height="' + f2(bh) + '"/></g>';

    });
    s += '</g>';

    s += '<line class="grid" x1="' + left + '" x2="' + (left + plotW) + '" y1="' + volTop + '" y2="' + volTop + '"/>' +
      '<text class="ax-y" x="' + (left + plotW + 8) + '" y="' + (volTop + 11) + '">' + esc(fmtCompact(vTop)) + '</text>' +
      '<text class="ax-y ax-name" x="' + (left + plotW + 8) + '" y="' + (volTop + volH) + '">成交量</text>';
    for (i = start; i < n; i++) {

      var prevOp = isNum(O[i]) ? O[i] : C[i];

    // 指標面板

    });
    if (indKey === 'macd') {

      }

    indDefs.forEach(function (sd) {

    });
    s += '<line class="axis" x1="' + left + '" x2="' + (left + plotW) + '" y1="' + bottom + '" y2="' + bottom + '"/></g>';

    // X 軸：每個月第一個交易日標月份
    s += '<g class="x-axis">';
    var lastLabelX = -999, prevMonth = '';
    for (i = start; i < n; i++) {
      var ds = String(dates[i] === null || dates[i] === undefined ? '' : dates[i]), mo = ds.slice(0, 7);
      if (mo !== prevMonth) {
        var firstOfRun = i === start, dayN = parseInt(ds.slice(8, 10), 10) || 1;

        var mnum = parseInt(ds.slice(5, 7), 10);
        s += '<line class="tick" x1="' + f2(xx) + '" x2="' + f2(xx) + '" y1="' + bottom + '" y2="' + (bottom + 4) + '"/><text class="ax-x" x="' + f2(xx) + '" y="' + (bottom + 17) + '">' + (mnum === 1 ? ds.slice(0, 4) : (mnum + '月')) + '</text>';

      }

      read: '量比高，可能是有利多或利空消息、法人調整持股等；爆量的那天可能上漲也可能下跌，要搭配價格方向和新聞一起判斷。資料不足 21 個交易日的股票不計算。' },
    { key: 'ma', group: '技術指標', title: '均線（月線、季線、年線）', en: 'Moving Average',
      plain: '均線是把最近 N 天的收盤價加起來平均，連成一條線，用來抹平每天的小起伏、看出大方向。常用的有 5 日（週線）、20 日（月線）、60 日（季線）、120 日（半年線）、240 日（年線）。收盤價在均線之上，就叫「站上」那條均線。',
      how: 'N 日均線 = 最近 N 個交易日收盤價的平均；「站上月線」是收盤價 > 20 日均線，「均線多頭排列」是 5 日線 > 20 日線 > 60 日線。',
      read: '站上均線，表示最近的價格比過去一段時間的平均高，常被用來描述趨勢偏強，跌破則相反。均線是用過去的資料算的，反應比較慢；股價在區間盤整時會來回穿越均線，訊號就不明確。' },
    { key: 'bias', group: '技術指標', title: '乖離率', en: 'Bias',
      plain: '乖離率在量股價離均線有多遠。可以想成小狗牽著繩子散步，均線是主人，小狗離主人越遠，乖離率就越大。',
      how: '月線乖離率 = (收盤價 ÷ 20 日均線 − 1) × 100%。',
      read: '正值越大，代表股價比近 20 日平均高得越多；負值代表比平均低。離均線很遠時，有時會往均線靠近，但漲勢或跌勢較明顯的走勢也可能維持很久，所以只能當作「目前偏離多少」的描述。' },
    { key: 'rsi', group: '技術指標', title: 'RSI（相對強弱指標）', en: 'RSI',
      plain: 'RSI 把最近 14 天的上漲力道和下跌力道做比較，換算成 0 到 100 的數字。越接近 100，表示這段時間漲的天數與幅度占優勢；越接近 0，表示跌的占優勢。',
      how: 'RSI = 100 − 100 ÷ (1 + 平均漲幅 ÷ 平均跌幅)，採 14 日、Wilder 平滑（之後每天用「舊值 × 13/14 ＋ 新值 × 1/14」更新）。',
      read: '一般習慣把 70 以上稱為「超買」、30 以下稱為「超賣」，意思只是漲或跌得比較急；股價持續上漲的期間，RSI 可以長時間停在 70 以上，所以到了這個區間並不代表一定會反轉。' },
    { key: 'kd', group: '技術指標', title: 'KD 指標', en: 'KD',
      plain: 'KD 看的是：今天的收盤價，落在最近 9 天最高價與最低價之間的哪個位置。K 線反應快、D 線反應慢，兩條線都在 0～100 之間移動。',
      how: 'RSV = (今日收盤 − 近 9 日最低) ÷ (近 9 日最高 − 近 9 日最低) × 100；K = 前一日 K × 2/3 ＋ RSV × 1/3；D = 前一日 D × 2/3 ＋ K × 1/3；起始值都是 50。',
      read: 'K 由下往上穿過 D 叫「黃金交叉」（本工具檢查最近 3 天內是否發生），反過來叫「死亡交叉」。數值在 80 以上算偏熱、20 以下算偏冷，但盤整時交叉很頻繁，訊號容易失準。' },
    { key: 'macd', group: '技術指標', title: 'MACD', en: 'MACD',
      plain: 'MACD 用兩條速度不同的「加權平均線」（快線與慢線）之間的距離，來觀察股價的動能是在變強還是變弱。',
      how: 'DIF = 12 日 EMA − 26 日 EMA；訊號線 = DIF 的 9 日 EMA；柱狀體 = DIF − 訊號線（EMA 是越近的日子權重越大的平均）；「MACD 柱狀體為正」就是柱狀體 > 0。',
      read: '柱狀體由負轉正，表示短期動能比前一段時間增強；由正轉負則相反。它是用過去價格算出來的，反應落後，在盤整區間常常來回翻轉。' },
    { key: 'goldenCross', group: '技術指標', title: '均線黃金交叉', en: 'Golden Cross',
      plain: '短期的平均價格（5 日線），從下方追上並超過長期的平均價格（20 日線），就叫均線黃金交叉。可以想成最近的價格，開始比過去一個月的平均還高。',
      how: '最近 5 個交易日內，有某一天 5 日均線 > 20 日均線，而且前一天 5 日均線 ≤ 20 日均線。',
      read: '常被用來描述趨勢可能由弱轉強，但它是落後的訊號：發生時股價通常已經走了一段，盤整時也容易出現來回交叉的假訊號。反過來的情形叫死亡交叉。' },
    { key: 'newHigh', group: '技術指標', title: '創新高', en: 'New High',
      plain: '創新高，是指今天的收盤價，是最近一段時間所有收盤價中最高的（或並列最高）。',
      how: '收盤價 ≥ 最近 N 個交易日收盤價的最大值；本工具有 20 日（約一個月）、60 日（約一季）、240 日（約一年）三種。',
      read: '創新高只說明目前價格站在這段期間的最高位置，常被用來描述漲勢較明顯；之後也可能回檔，要搭配成交量與基本面一起觀察。' },
    { key: 'pos52', group: '技術指標', title: '一年區間位置', en: '52-Week Position',
      plain: '想像過去一年的最低價是地板、最高價是天花板，一年區間位置就是現在的收盤價站在這棟樓的第幾層：0% 在地板，100% 在天花板。',
      how: '(收盤價 − 近一年最低價) ÷ (近一年最高價 − 近一年最低價) × 100%；「近一年」取最近 240 個交易日（資料不足時用現有的，但少於 60 個交易日不計算），高低點用每日的最高價與最低價。',
      read: '接近 100%，表示在一年的高點附近；接近 0%，表示在低點附近。它只說明目前的相對位置，不能說明價格為什麼在這裡。' },
    { key: 'volatility', group: '風險', title: '波動率', en: 'Volatility',
      plain: '波動率衡量股價每天上上下下的程度。數字越大，表示股價起伏越劇烈；數字小，表示走勢比較平穩。',
      how: '取最近 20 個交易日的每日漲跌幅，算出樣本標準差，再乘以 √252 × 100%，換算成一年的尺度（年化）。',
      read: '例如 30%，粗略表示依最近 20 天的起伏推算，一年內漲跌的幅度常見範圍約在 ±30% 左右。高波動代表漲跌都可能比較大；它只描述過去 20 天，不代表未來。' },
    { key: 'maxDrawdown', group: '風險', title: '近半年最大回檔', en: 'Max Drawdown',
      plain: '最大回檔是：這段期間裡，股價從某個高點往下掉，最多掉了幾 %。它回答的是「最慘的時候，帳面上會少掉多少」。',
      how: '取最近 120 個交易日（約半年）的收盤價，找出「從任一高點到之後最低點」的最大跌幅，用負的百分比表示（-20% 就是曾經從高點跌了兩成）。',
      read: '越接近 0%，表示這半年來沒有跌過什麼；數字越負，表示曾經跌得越深。它只是回顧過去半年，方便比較不同股票的抗震程度。' },
    { key: 'inst', group: '籌碼', title: '三大法人買賣超', en: 'Institutional Trading',
      plain: '三大法人是外資（外國的法人機構）、投信（國內的基金公司）和自營商（券商自己的買賣）。他們的資金大，每天買賣的數量會公布在交易所網站。「買超」是買得比賣得多，「賣超」則相反。',
      how: '買賣超 = 買進股數 − 賣出股數，本工具換算成張；外資含外陸資與外資自營商（上櫃用官方的外資及陸資合計）；「近 5 日、近 20 日買賣超」是最近 5 或 20 個交易日的合計，資料只保留最近約 25 個交易日。',
      read: '法人買賣可以讓你知道大額資金最近的動向，但他們也會判斷錯誤，也常做短線進出，所以買超或賣超都不能保證之後的股價走勢。' },
    { key: 'foreignStreak', group: '籌碼', title: '連買／連賣天數', en: 'Buying Streak',
      plain: '從最近一天開始往前數，外資（或投信）連續幾天都是買超。連續賣超就用負數表示，例如 -3 代表連續 3 天賣超。',
      how: '最近一天買賣超 > 0 時，往回數連續 > 0 的天數；< 0 時，數連續 < 0 的天數並加上負號；剛好是 0 就顯示 0；中間只要有一天不是同方向，就從那天中斷。',
      read: '連續買超，表示這段期間外資持續站在買方，但每天的買超量可能很小，可以再對照「近 5 日買賣超」的張數；投信的連買天數看法相同。' },
    { key: 'disposal', group: '風險', title: '處置股', en: 'Disposition',
      plain: '當某檔股票的價格或成交量在短時間內出現異常，證交所或櫃買中心會公告它為處置股。處置期間（依公告而定，常見約十個營業日）交易會有額外限制，例如改成每隔幾分鐘才撮合一次，有時還要預先繳足款項或股票。',
      how: '依官方處置公告：處置期間的結束日不早於資料日期，就標示為處置股。',
      read: '被列為處置股，表示它近期的交易特別熱或波動特別大，是個風險提醒，也代表買賣時比較不順暢；這個標示本身不評價公司的好壞。' },
    { key: 'percentile', group: '方法', title: '百分位（贏過幾 % 的股票）', en: 'Percentile',
      plain: '百分位是「排名」的另一種說法。例如某檔股票的價值分數是 82，意思是：在全市場有資料的股票裡，它贏過約 82% 的股票。',
      how: '百分位 = (比它小的檔數 ＋ 0.5 × 一樣的檔數) ÷ 有資料的總檔數 × 100；遇到「越低越好」的項目（例如本益比），就用 100 減去百分位。',
      read: '百分位只告訴你相對的位置，不是好壞的絕對標準；如果整體市場的表現都很差，排名在前面也不代表本身很好。某一項沒有資料時，就不計入那一項。' },
    { key: 'factor', group: '方法', title: '六面向分數', en: 'Factor Scores',
      plain: '六面向是把一檔股票的特色整理成六張成績單：價值、成長、獲利、動能、籌碼、穩健，每一面都是 0 到 100 分。分數是和全市場其他股票比出來的「相對位置」。',
      how: '每一面都是下列項目百分位的平均（缺資料的項目不計）：價值＝本益比（低者佳）、股價淨值比（低者佳）、殖利率；成長＝營收年增率、累計營收年增率；獲利＝ROE、營業利益率、毛利率；動能＝近 20／60／120 日漲幅、一年區間位置；籌碼＝外資近 20 日買賣超占股本比例、投信近 20 日買賣超、外資連買天數；穩健＝波動率（低者佳）、近半年最大回檔（越接近 0 越好）、負債比（低者佳）、市值。',
      read: '分數高，只代表在那一面相對突出，不代表整體結果會好；如果某一面只有一兩個項目有資料，分數的參考性就比較低。六面向分數不是預測，也不是任何買賣的依據。' },
    { key: 'backtest', group: '方法', title: '回測', en: 'Backtest',
      plain: '回測是用過去的資料，模擬「假如當時這樣做，結果會怎樣」。本工具的做法是：每隔一段時間，就照同一組條件重新挑一次股票，平均分配資金持有到下一次換股，最後看累計報酬。',
      how: '每期報酬 = 該期持股報酬的平均（等權重），全部期數的報酬連乘就是累計報酬；可選擇扣除交易成本（買賣各 0.1425% 手續費加賣出 0.3% 證交稅，合計約 0.585%），並與加權指數、全市場等權平均對照。',
      read: '過去的結果不代表未來。回測只含目前仍掛牌的股票（存活者偏差）、股價沒有還原除權息、也沒有計入股利，期間又不長，所以數字只能當作「大致的感覺」。只有靠股價與估值歷史就能還原的條件才能回測，最新財報與法人資料沒有歷史，無法回測。' },
    { key: 'changePct', group: '股價與量能', title: '漲跌幅', en: 'Change %',
      plain: '最近一天的收盤價，比前一個有成交的日子的收盤價高了或低了幾 %。台股習慣用紅色代表上漲、綠色代表下跌，本工具同時也會加上 ▲▼ 符號。',
      how: '(收盤 − 前一個有成交日的收盤) ÷ 前一個有成交日的收盤 × 100%。除權息日，或前一天這檔股票沒有成交時，這個算法會和交易所公布的漲跌幅不同。今天沒有成交的股票，顯示的是它最後成交那天的漲跌幅。',
      read: '單日漲跌幅只反映一天的變化，台股每天最多漲跌 10%。除權息那天，股價會因為配息配股而被調低，這個數字看起來像下跌，但不一定是真的虧損。要看趨勢，通常會搭配近 20 日、60 日等較長期間的漲幅一起看。' },
    { key: 'ret', group: '股價與量能', title: '近 N 日漲幅', en: 'Return',
      plain: '把今天的收盤價，跟 N 個交易日前的收盤價比，漲了或跌了幾 %。本工具有近 5 日（約一週）、20 日（約一個月）、60 日（約一季）、120 日（約半年）、240 日（約一年）。',
      how: '(今日收盤 ÷ N 個交易日前的收盤 − 1) × 100%。',
      read: '股價沒有還原除權息，所以遇到除息的股票，漲幅會比實際含股利的報酬低一些；漲幅是看過去的結果，不能用來推論之後的走勢。' },
    { key: 'market', group: '方法', title: '上市與上櫃', en: 'TWSE / TPEx',
      plain: '台灣的股票分成兩個市場：在「證券交易所」掛牌的叫上市，在「證券櫃檯買賣中心」掛牌的叫上櫃。上市公司通常規模較大，上櫃公司則包含許多中小型公司，兩邊的股票都能在一般券商買賣。',
      how: '依公司掛牌的市場分類，沒有計算；本工具的資料分別來自這兩個單位的公開資料。',
      read: '上市或上櫃只是掛牌的地方不同，不代表公司的好壞；比較不同股票時，還是要回頭看它的產業與財務數字。' }
  ];

  var glossaryEls = {};   // key → .term-card
  var glossaryIndex = []; // [{el, hay}]

  function buildGlossary() {
    var root_ = $('view-glossary');
    if (!root_ || root_.getAttribute('data-built')) return;
    root_.setAttribute('data-built', '1');

    var head = h('div', { class: 'glossary-head card lilac' }, [
      h('h2', { text: '📖 小辭典' }),
      h('p', { text: '看到不懂的名詞，在旁邊按「？」就會跳到這裡。每個名詞都有白話解釋、怎麼算、怎麼看；「怎麼看」只說明一般的解讀方式與限制，不是買賣的建議。' }),
      h('div', { class: 'field' }, [
        h('label', { for: 'glossary-search', text: '搜尋名詞' }),
        h('input', { id: 'glossary-search', class: 'input', type: 'search', placeholder: '例如：本益比、均線、法人…', autocomplete: 'off', 'aria-controls': 'glossary-list' })
      ]),
      h('p', { id: 'glossary-count', class: 'muted', role: 'status', 'aria-live': 'polite' })
    ]);
    var back = h('button', { id: 'glossary-back', class: 'btn btn-soft btn-sm', type: 'button', hidden: true });
    back.addEventListener('click', function () {
      var c = backCode;
      backCode = null;
      updateBack();
      if (c) openDetail(c);
    });
    var list = h('div', { id: 'glossary-list' });
    var empty = h('div', { id: 'glossary-empty', class: 'empty', hidden: true }, [
      h('span', { 'aria-hidden': 'true', text: '🔍' }),
      h('p', { text: '找不到符合的名詞，換個關鍵字試試看。' })
    ]);
    var tones = ['pink', 'mint', 'cream', 'sky', 'lilac'];
    GLOSSARY.forEach(function (g, i) {
      var card = h('article', { class: 'term-card card ' + tones[i % tones.length], 'data-term': g.key, id: 'term-' + g.key, tabindex: '-1' }, [
        h('h3', null, [g.title, h('small', { text: g.en }), h('span', { class: 'chip term-group', text: g.group })]),
        h('p', { class: 'term-plain', text: g.plain }),
        h('p', { class: 'term-how' }, [h('span', { class: 'term-tag', text: '怎麼算' }), g.how]),
        h('p', { class: 'term-read' }, [h('span', { class: 'term-tag', text: '怎麼看' }), g.read])
      ]);
      list.appendChild(card);
      glossaryEls[g.key] = card;
      glossaryIndex.push({ el: card, hay: (g.key + ' ' + g.title + ' ' + g.en + ' ' + g.group + ' ' + g.plain + ' ' + g.how + ' ' + g.read).toLowerCase() });
    });
    root_.appendChild(back);
    root_.appendChild(head);
    root_.appendChild(list);
    root_.appendChild(empty);

    var input = $('glossary-search');
    input.addEventListener('input', function () { clearTermFocus(); filterGlossary(input.value); });
    filterGlossary('');
  }

  function filterGlossary(q) {
    var tokens = String(q || '').toLowerCase().split(/\s+/).filter(Boolean);
    var shown = 0;
    glossaryIndex.forEach(function (it) {
      var ok = tokens.every(function (t) { return it.hay.indexOf(t) >= 0; });
      it.el.hidden = !ok;
      if (ok) shown++;
    });
    var cnt = $('glossary-count'), empty = $('glossary-empty');
    if (cnt) cnt.textContent = tokens.length ? '找到 ' + shown + ' 個名詞' : '共 ' + GLOSSARY.length + ' 個名詞';
    if (empty) empty.hidden = shown > 0;
    var list = $('glossary-list');
    if (list) list.hidden = shown === 0;
  }

  function clearTermFocus() {
    if (!doc) return;
    var on = doc.querySelectorAll('.term-card.is-focus');
    for (var i = 0; i < on.length; i++) on[i].classList.remove('is-focus');
  }

  var backCode = null;       // 小辭典「回到詳情」要開的代號
  var lastClosed = { code: null, t: 0 };   // 最近一次關閉的詳情

  function stockLabel(code) {
    var st = state.snapshot && state.snapshot.stocks;
    if (st) for (var i = 0; i < st.length; i++) if (st[i].code === code) return code + ' ' + st[i].name;

  /** 整句剛好是股票：代號，或名稱完全相等且唯一。回傳 {code, name} 或 null。 */
  function stockFromQuery(text) {
    var t = text.trim();
    if (!t) return null;
    var snap = st().snapshot, list = (snap && snap.stocks) || [], i, hit = null;
    for (i = 0; i < list.length; i++) if (list[i].code === t) return { code: list[i].code, name: list[i].name };
    var found = [];
    try {
      if (typeof A().findStocks === 'function') found = A().findStocks(t, 8) || [];
      else {
        for (i = 0; i < list.length; i++) {
          if (list[i].code.indexOf(t) === 0 || String(list[i].name).indexOf(t) >= 0) found.push(list[i]);
          if (found.length >= 8) break;
        }

  // ---------- 結果表 ----------
  function columnsFor(conds) {

    var cols = [
      { id: 'watch', label: '☆', sr: '自選', kind: 'watch' },
      { id: 'stock', label: '代號・名稱', kind: 'stock' },
      { id: 'industry', label: '產業', kind: 'industry' },
      { id: 'close', label: '收盤', sort: 'close', num: true, cls: 'cell-close', text: function (r) { return F().price(r.m.close); } },
      { id: 'changePct', label: '漲跌幅', sort: 'changePct', num: true, cls: 'cell-chg', kind: 'chg' },
      { id: 'spark', label: '近 60 日走勢', kind: 'spark' },
      { id: 'volume', label: '成交量', sort: 'volume', num: true, text: function (r) { return F().vol(r.m.volume); } },
      { id: 'pe', label: '本益比', sort: 'pe', num: true, term: 'pe', text: function (r) { return F().num(r.m.pe, 2); } },
      { id: 'yield', label: '殖利率', sort: 'yield', num: true, term: 'yield', text: function (r) { return F().pct(r.m.yield, 2); } },
      { id: 'pb', label: '股價淨值比', sort: 'pb', num: true, term: 'pb', text: function (r) { return F().num(r.m.pb, 2); } },
      { id: 'revYoy', label: '營收年增率', sort: 'revYoy', num: true, term: 'revYoy', kind: 'signed' },
      { id: 'roe', label: 'ROE', sort: 'roe', num: true, term: 'roe', text: function (r) { return F().pct(r.m.roe, 2); } },
      { id: 'factors', label: '六面向', kind: 'factors', term: 'factor' }
    ];
    var seen = {};
    (conds || []).forEach(function (c) {
      var k = c.field;
      if (seen[k] || DEFAULT_KEYS[k]) return;
      seen[k] = 1;
      var f = S().fieldMap[k];
      if (!f) return;
      cols.push({
        id: 'x-' + k, label: f.label, extra: true, field: k, num: f.type === 'number',
        sort: f.type === 'number' ? k : null, term: termKey(k) && f.type === 'number' ? termKey(k) : null,
        cls: 'cell-extra' + (f.type === 'bool' ? ' cell-bool' : ''), kind: 'extra'

  }
  function extraText(key, row) {
    var v = S().getValue(row, key);
    if (key === 'market') return v === 'TWSE' ? '上市' : v === 'TPEx' ? '上櫃' : '—';
    return fmt().field(key, v);
  }

  function renderHead(cols) {
    var s = st().sort, tr = h('tr');
    cols.forEach(function (c) {
      var th = h('th', { scope: 'col', 'data-col': c.id, class: c.num ? 'num' : '' });
      if (c.sr) { th.appendChild(h('span', { 'aria-hidden': 'true', text: c.label })); th.appendChild(h('span', { class: 'sr-only', text: c.sr })); }
      else if (c.sort) {

        th.setAttribute('aria-sort', active ? (s.dir === 'asc' ? 'ascending' : 'descending') : 'none');
        th.appendChild(h('button', { type: 'button', class: 'sort-btn', 'data-sort': c.sort, title: '依' + c.label + '排序' },
          h('span', { text: c.label }),
          h('span', { class: 'sort-ind', 'aria-hidden': 'true', text: active ? (s.dir === 'asc' ? '▲' : '▼') : '' })));
      } else th.textContent = c.label;
      if (c.term) th.appendChild(h('button', { type: 'button', class: 'term', 'data-term': c.term, 'aria-label': '名詞解釋：' + c.label, title: '這是什麼意思？', text: '？' }));
