  function sparkFor(code) {
    if (V.spark[code] !== undefined) return V.spark[code];
    var svg = '';
    try {
      var stock = V.stockMap && V.stockMap[code];
      if (stock && stock.c && root.TW.charts && root.TW.charts.spark) {
        svg = root.TW.charts.spark(stock.c.slice(-60), { width: 96, height: 28 }) || '';
      }
    } catch (e) { svg = ''; }
    V.spark[code] = svg;
    return svg;
  }

  function starText(on) { return on ? '★' : '☆'; }

  function isIdle(r) {
    var snap = st().snapshot;
    return !!(snap && snap.asOf) && r.m.date !== snap.asOf;
  }
  /** '2026-10-02' → '10/02'（無法解讀時回傳空字串） */
  function shortDate(iso) {
    var m = typeof iso === 'string' ? /^\d{4}-(\d{2})-(\d{2})/.exec(iso) : null;
    return m ? m[1] + '/' + m[2] : '';
  }

  function buildRow(r, cols) {
    var F = fmt(), tr = h('tr', { class: 'result-row', 'data-code': r.code, tabindex: '0' });
    for (var i = 0; i < cols.length; i++) {
      var c = cols[i], td = h('td', { class: (c.num ? 'num ' : '') + (c.cls || '') }), v;
      switch (c.kind) {
        case 'watch':
          var on = A().isWatched(r.code);
          td.className = 'cell-watch';
          td.appendChild(h('button', {
            type: 'button', class: 'watch-toggle', 'aria-pressed': on ? 'true' : 'false',
            'aria-label': (on ? '移出自選：' : '加入自選：') + r.code + ' ' + r.name, text: starText(on)
          }));
          break;
        case 'stock':
          td.className = 'cell-stock';
          td.appendChild(h('span', { class: 'cell-code num', text: r.code }));
          td.appendChild(document.createTextNode(' '));
          td.appendChild(h('span', { class: 'cell-name', text: r.name }));
          if (r.m.disposal === true) td.appendChild(h('span', { class: 'badge warn', text: '處置' }));
          if (isIdle(r)) {
            td.appendChild(h('span', {
              class: 'badge warn idle-badge', title: '這檔今天沒有成交，顯示的是最後成交日的價格',
              text: (shortDate(r.m.date) || '最近') + ' 成交'
            }));
            tr.setAttribute('data-idle', '1');
          }
          break;
        case 'industry':
          td.className = 'cell-industry'; td.textContent = r.industry || '—'; break;
        case 'chg':
          v = r.m.changePct;
          var d = F.dir(v);
          td.className += ' ' + d;
          td.textContent = v === null || v === undefined || !isFinite(v) ? '—' : F.arrow(d) + ' ' + F.pct(Math.abs(v), 2);
          break;
        case 'spark':
          td.className = 'cell-spark';
          td.innerHTML = sparkFor(r.code);        // 程式產生的 SVG，非使用者資料
          break;
        case 'signed':
          v = r.m.revYoy;
          td.className += ' ' + F.dir(v);
          td.textContent = F.pct(v, 1, true);
          break;
        case 'factors':
          td.className = 'cell-factors';
          td.appendChild(factorBars(r));
          break;
        case 'extra':
          td.textContent = extraText(c.field, r);
          break;
        default:
          td.textContent = c.text ? c.text(r) : '';
      }
      tr.appendChild(td);
    }
    return tr;
  }

  function factorBars(r) {
    var wrap = h('span', { class: 'factor-bars', role: 'img' }), parts = [];
    FACTORS.forEach(function (f) {
      var v = r.f ? r.f[f[0]] : null, ok = typeof v === 'number' && isFinite(v);
      var tip = f[1] + ' ' + (ok ? Math.round(v) : '—');
      parts.push(tip);
      var bar = h('i', { class: ok ? 'fb' : 'fb na', title: tip });
      if (ok) bar.style.height = Math.max(2, Math.min(100, v)) + '%';
      wrap.appendChild(bar);
    });
    wrap.setAttribute('title', parts.join('　'));
    wrap.setAttribute('aria-label', '六面向分數：' + parts.join('、'));
    return wrap;
  }

  function strictest() {
    var s = st(), res = s.result, conds = s.conditions || [];
    if (!res || !conds.length) return null;
    var best = 0;
    for (var i = 1; i < conds.length; i++) if (res.perCondition[i] < res.perCondition[best]) best = i;
    return { index: best, n: res.perCondition[best], cond: conds[best] };
  }

  function renderEmpty() {
    var box = q('result-empty'), s = st(), strict = strictest();
    clear(box);
    box.appendChild(h('div', { class: 'empty-icon', 'aria-hidden': 'true', text: '🫧' }));
    if (!(s.rows || []).length) {
      box.appendChild(h('p', { class: 'empty-title', text: '目前沒有可以篩選的股票資料' }));
      return;
    }
    box.appendChild(h('p', { class: 'empty-title', text: '沒有股票同時符合這些條件' }));
    if (strict) {
      box.appendChild(h('p', { class: 'empty-detail', id: 'empty-strict', 'data-index': strict.index },
        '最嚴格的是『' + S().describe(strict.cond) + '』，只有 ' + fmt().int(strict.n) + ' 檔符合'));
      box.appendChild(btn({ id: 'btn-drop-strict', class: 'btn btn-soft btn-sm' }, '拿掉這個條件看看'));
    }
  }

  function renderTable() {
    var t0 = root.performance && root.performance.now ? root.performance.now() : 0;
    var s = st(), res = s.result, rows = res ? res.rows : [], conds = s.conditions || [];
    var cols = columnsFor(conds);
    V.cols = cols;
    var isEmpty = !!res && res.total === 0;
    q('result-empty').hidden = !isEmpty;
    q('result-wrap').hidden = isEmpty || !res;
    if (isEmpty) renderEmpty();
    renderHead(cols);
    clear(V.tbody);
    var n = Math.min(V.shown, rows.length), frag = document.createDocumentFragment();
    for (var i = 0; i < n; i++) frag.appendChild(buildRow(rows[i], cols));
    V.tbody.appendChild(frag);
    updateMore();
    if (V.focusSort) {
      var b = V.thead.querySelector('.sort-btn[data-sort="' + V.focusSort + '"]');
      if (b) b.focus();
      V.focusSort = null;
    }
    var ms = root.performance && root.performance.now ? root.performance.now() - t0 : 0;
    q('result-table').setAttribute('data-render-ms', ms.toFixed(1));
    q('result-table').setAttribute('data-shown', String(n));
  }
  function updateMore() {
    var res = st().result, total = res ? res.rows.length : 0, shown = V.tbody.children.length, left = total - shown;
    var b = q('btn-more');
    b.hidden = left <= 0;
    if (left > 0) b.textContent = '再顯示 ' + Math.min(PAGE, left) + ' 檔' + (left > PAGE ? '（還有 ' + fmt().int(left) + ' 檔）' : '');
  }
  function showMore() {
    var res = st().result;
    if (!res) return;
    var from = V.tbody.children.length, to = Math.min(res.rows.length, from + PAGE), frag = document.createDocumentFragment();
    for (var i = from; i < to; i++) frag.appendChild(buildRow(res.rows[i], V.cols));
    V.tbody.appendChild(frag);
    V.shown = to;
    updateMore();
    var first = V.tbody.children[from];
    if (first) first.focus();

  function refreshStars() {
    var rows = V.tbody.children;
    for (var i = 0; i < rows.length; i++) {
      var tr = rows[i], b = tr.querySelector('.watch-toggle');
      if (!b) continue;
      var code = tr.getAttribute('data-code'), on = A().isWatched(code);

  // ---------- CSV ----------
  function csvCell(v) {
    if (v === null || v === undefined) return '';
    var s = String(v);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function r2(x) { return typeof x === 'number' && isFinite(x) ? Math.round(x * 100) / 100 : null; }
  function buildCsv() {
    var s = st(), res = s.result, rows = res ? res.rows : [], SC = S();
    var head = ['代號', '名稱', '市場', '產業', '收盤', '漲跌幅(%)', '成交量(張)', '本益比', '殖利率(%)', '股價淨值比', '營收年增率(%)', 'ROE(%)'];
    FACTORS.forEach(function (f) { head.push(f[1] + '分數'); });
    var extras = (V.cols || []).filter(function (c) { return c.extra && c.field !== 'market' && c.field.indexOf('f.') !== 0; });
    extras.forEach(function (c) { head.push(c.label + (SC.fieldMap[c.field].unit ? '(' + SC.fieldMap[c.field].unit + ')' : '')); });
    var lines = [head.map(csvCell).join(',')];
    rows.forEach(function (r) {
      var m = r.m, line = [r.code, r.name, r.market === 'TWSE' ? '上市' : r.market === 'TPEx' ? '上櫃' : r.market, r.industry,
        r2(m.close), r2(m.changePct), r2(m.volume), r2(m.pe), r2(m.yield), r2(m.pb), r2(m.revYoy), r2(m.roe)];
      FACTORS.forEach(function (f) { line.push(r.f ? r2(r.f[f[0]]) : null); });
      extras.forEach(function (c) {
        var v = SC.getValue(r, c.field);
        line.push(typeof v === 'boolean' ? (v ? '是' : '否') : typeof v === 'number' ? r2(v) : v);
      });
      lines.push(line.map(csvCell).join(','));
    });
    return lines.join('\n');
  }
  function copyCsv() {
    var res = st().result;
    if (!res || !res.total) { toast('目前沒有可以複製的股票'); return; }
    var csv = buildCsv(), n = res.rows.length;
    var fb = q('copy-fallback-wrap');
    function fallback() {
      fb.hidden = false;
      var ta = q('copy-fallback');
      ta.value = csv;
      ta.focus(); ta.select();
      toast('請按 Ctrl+C 複製');
    }
    try {
      if (root.navigator && root.navigator.clipboard && root.navigator.clipboard.writeText) {
        root.navigator.clipboard.writeText(csv).then(function () {
          fb.hidden = true;
          toast('已複製 ' + fmt().int(n) + ' 檔');
        }, fallback);
      } else fallback();
    } catch (e) { fallback(); }
  }

  // ---------- 我的策略：存檔 ----------
  function openSaveForm() {
    var f = q('strategy-form'), s = st();

    f.hidden = false;

  // ---------- 事件接線 ----------
  function wire() {

    });

    q('btn-add-cond').addEventListener('click', function () { if (q('cond-picker').hidden) openPicker(); else closePicker(true); });
    q('btn-clear-cond').addEventListener('click', function () { apply([], { presetId: null, limit: null }); });
    q('cond-list').addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('.cond-remove') : null;
      if (!b) return;

      removeCond(chips.indexOf(b.parentNode));
    });
    q('cond-field').addEventListener('change', onFieldChange);
    q('cond-op').addEventListener('change', function () { setError(''); onOpChange(); });

      else if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type === 'number') { e.preventDefault(); addCondition(); }
    });

    if (row) return { code: code, name: row.name, row: row, stock: stock, m: row.m, f: row.f, stale: false };
    var m = null;
    try { m = TW.factors.computeMetrics(stock, st.snapshot); } catch (e) { m = null; }
    return { code: code, name: stock.name, stock: stock, m: m, f: null, stale: true };
  }

  function watchList() { return (app().state.watch || []).slice(); }

  function pruneCompare() {
    var w = watchList();
    S.compare = S.compare.filter(function (c) { return w.indexOf(c) >= 0 && !entry(c).missing; });
  }

  /* ---------- 格式 ---------- */

  function dirNode(x, digits) {
    var f = fmt(), d = f.dir(x);
    if (!isNum(x)) return h('span', { class: 'flat', text: '—' });
    return h('span', { class: d }, [f.arrow(d) + ' ' + f.pct(Math.abs(x), digits == null ? 2 : digits)]);
  }
  function signedNode(x) {
    var f = fmt(), d = f.dir(x);
    if (!isNum(x)) return h('span', { class: 'muted', text: '—' });
    return h('span', { class: d }, [(d === 'up' ? '+' : d === 'down' ? '-' : '') + f.pct(Math.abs(x), 2)]);
  }
  function cellNode(kind, v) {
    var f = fmt();
    if (!isNum(v)) return h('span', { class: 'muted', text: '—' });
    switch (kind) {
      case 'price': return document.createTextNode(f.price(v));
      case 'cap': return document.createTextNode(f.cap(v));
      case 'x': return document.createTextNode(f.num(v, 2) + ' 倍');
      case 'pct': return document.createTextNode(f.pct(v, 2));
      case 'spct': return signedNode(v);
      case 'yuan': return document.createTextNode(f.num(v, 2) + ' 元');
      case 'score': return document.createTextNode(f.int(v) + ' 分');
    }
    return document.createTextNode(String(v));
  }

  /* ---------- 自選股表 ---------- */

  function factorBars(f) {
    var box = h('span', { class: 'watch-factors', role: 'img' });
    var parts = [];
    FACTORS.forEach(function (x) {
      var v = f ? f[x[0]] : null;
      var bar = h('span', { class: 'wf-bar' + (isNum(v) ? '' : ' is-na') });
      var fill = h('span', { class: 'wf-fill' });
      if (isNum(v)) fill.style.height = Math.max(6, Math.round(v)) + '%';
      bar.appendChild(fill);
      box.appendChild(bar);
      parts.push(x[1] + ' ' + (isNum(v) ? Math.round(v) : '—'));
    });
    box.setAttribute('title', parts.join('、'));
    box.setAttribute('aria-label', '六面向分數：' + parts.join('、'));
    return box;
  }

  function sparkCell(e) {
    var td = h('td', { class: 'cell-spark watch-spark' });
    if (e.stock) {
      var c = e.stock.c, vals = c.slice(Math.max(0, c.length - 60));
      try { td.innerHTML = TW.charts.spark(vals, { width: 96, height: 28 }); } catch (err) { td.textContent = '—'; }
    }
    return td;
  }

  function buildRow(code) {
    var f = fmt(), e = entry(code);
    var tr = h('tr', { class: 'watch-row', 'data-code': code, tabindex: '0' });
    var cb = h('input', { type: 'checkbox', class: 'compare-check', value: code, 'aria-label': '加入比較：' + code + (e.name ? ' ' + e.name : '') });
    if (e.missing) cb.disabled = true;
    if (S.compare.indexOf(code) >= 0) cb.checked = true;
    tr.appendChild(h('td', { class: 'watch-cb' }, [cb]));
    var rm = h('button', { type: 'button', class: 'btn btn-ghost btn-sm watch-remove', 'aria-label': '移除自選股：' + code + (e.name ? ' ' + e.name : ''), text: '移除' });
    if (e.missing) {
      tr.classList.add('is-missing');
      tr.appendChild(h('td', { colspan: '8', class: 'watch-missing' }, [
        h('span', { class: 'num watch-code', text: code }), ' ', h('span', { class: 'muted', text: '資料中沒有這檔' })
      ]));
      tr.appendChild(h('td', { class: 'watch-act' }, [rm]));
      return tr;
    }
    var m = e.m || {};
    var nameCell = h('td', { class: 'watch-name' }, [
      h('span', { class: 'num watch-code', text: code }), ' ', h('span', { class: 'watch-nm', text: e.name }),
      m.disposal ? ' ' : null, m.disposal ? h('span', { class: 'badge warn', text: '處置' }) : null,
      e.stale ? ' ' : null, e.stale ? h('span', { class: 'badge flat', text: '最近沒有成交' }) : null
    ]);
    tr.appendChild(nameCell);
    tr.appendChild(h('td', { class: 'num cell-close', text: f.price(m.close) }));
    tr.appendChild(h('td', { class: 'num cell-chg' }, [dirNode(m.changePct)]));
    tr.appendChild(sparkCell(e));
    tr.appendChild(h('td', { class: 'num', text: isNum(m.pe) ? f.num(m.pe, 2) + ' 倍' : '—' }));
    tr.appendChild(h('td', { class: 'num', text: isNum(m.yield) ? f.pct(m.yield, 2) : '—' }));
    tr.appendChild(h('td', { class: 'num' }, [signedNode(m.revYoy)]));
    tr.appendChild(h('td', { class: 'watch-fac' }, [factorBars(e.f)]));
    tr.appendChild(h('td', { class: 'watch-act' }, [rm]));
    return tr;
  }

  function renderList() {
    var list = watchList();
    var empty = list.length === 0;
    els.empty.hidden = !empty;
    els.tableWrap.hidden = empty;
    els.hint.hidden = empty;
    els.count.textContent = '共 ' + list.length + ' 檔';
    clear(els.tbody);
    list.forEach(function (code) { els.tbody.appendChild(buildRow(code)); });
  }

  /* ---------- 比較 ---------- */

  function bestSet(row, ents) {
    var vals = ents.map(function (e) { var v = row.get(e); return isNum(v) ? v : null; });
    var ok = vals.filter(function (v) { return v !== null; });
    if (!row.better || ok.length < 2) return [];
    var best = row.better === 'low' ? Math.min.apply(null, ok) : Math.max.apply(null, ok);
    var out = [];
    vals.forEach(function (v, i) { if (v !== null && v === best) out.push(i); });
    return out;
  }

  function drawCompareChart(ents) {
    safeDestroy(cmpChart); cmpChart = null;
    clear(els.cmpChart);
    els.cmpChart.removeAttribute('data-base-date');
    els.cmpChart.removeAttribute('data-first-values');
    var snap = app().state.snapshot, dates = snap.dates;
    var start = Math.max(0, dates.length - S.range);
    var base = -1;
    for (var i = start; i < dates.length; i++) {
      var all = true;
      for (var k = 0; k < ents.length; k++) if (!isNum(ents[k].stock.c[i])) { all = false; break; }
      if (all) { base = i; break; }
    }
    if (base < 0) {
      els.cmpChart.appendChild(h('div', { class: 'chart-empty', text: '這段期間沒有共同的交易日，無法比較' }));
      els.cmpNote.textContent = '';
      return;
    }
    var series = ents.map(function (e, idx) {
      var c = e.stock.c, b = c[base], pts = [];
      for (var j = base; j < dates.length; j++) if (isNum(c[j])) pts.push({ x: dates[j], y: c[j] / b * 100 });
      return { id: e.code, name: e.code + ' ' + e.name, color: 'cat-' + (idx + 1), points: pts };
    });
    els.cmpChart.setAttribute('data-base-date', dates[base]);
    els.cmpChart.setAttribute('data-first-values', series.map(function (s) { return s.points[0].y; }).join(','));
    els.cmpNote.textContent = '以 ' + fmt().date(dates[base]) + ' 為 100（這是這段期間內所有勾選的股票都有收盤價的第一天）。股價沒有還原除權息，除息日會讓線看起來往下掉。';
    cmpChart = TW.charts.line(els.cmpChart, {
      series: series, baseline: 100, height: (root.innerWidth || 1000) < 560 ? 260 : 320,
      yFormat: function (v) { return fmt().num(v, 1); }
    });
  }

  function drawCompareTable(ents) {
    var f = fmt();
    var thead = h('tr', null, [h('th', { scope: 'col', class: 'cmp-metric', text: '指標' })]);
    ents.forEach(function (e, idx) {
      thead.appendChild(h('th', { scope: 'col', class: 'num cmp-stock', 'data-code': e.code }, [
        h('span', { class: 'cmp-dot c' + (idx + 1), 'aria-hidden': 'true' }),
        h('span', { class: 'num', text: e.code }), ' ', h('span', { text: e.name })
      ]));
    });
    var tbody = h('tbody');
    CMP_ROWS.forEach(function (row) {
      var best = bestSet(row, ents);
      var lab = h('th', { scope: 'row', class: 'cmp-metric' }, [row.label]);
      if (row.term) lab.appendChild(termBtn(row.term, row.label));
      var tr = h('tr', { 'data-metric': row.key }, [lab]);
      ents.forEach(function (e, i) {
        var v = row.get(e);
        var td = h('td', { class: 'num' + (best.indexOf(i) >= 0 ? ' best' : ''), 'data-code': e.code, 'data-raw': isNum(v) ? String(v) : '' });
        td.appendChild(cellNode(row.kind, v));
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    clear(els.cmpTable);
    els.cmpTable.appendChild(h('thead', null, [thead]));
    els.cmpTable.appendChild(tbody);
  }

  function drawCompare() {
    pruneCompare();
    var ents = S.compare.map(entry).filter(function (e) { return !e.missing; });
    var show = ents.length >= 2;
    els.panel.hidden = !show;
    if (!show) { safeDestroy(cmpChart); cmpChart = null; clear(els.cmpChart); return; }
    var btns = els.panel.querySelectorAll('.cmp-range');
    for (var i = 0; i < btns.length; i++) btns[i].setAttribute('aria-pressed', Number(btns[i].getAttribute('data-range')) === S.range ? 'true' : 'false');
    drawCompareTable(ents);
    if (visible) drawCompareChart(ents);
  }

  function renderAll() {
    pruneCompare();
    renderList();
    drawCompare();
    dirty = false;
  }

  /* ---------- 組裝 ---------- */

  function onCheck(cb) {
    var code = cb.value, i = S.compare.indexOf(code);
    if (cb.checked) {
      if (i < 0) {
        if (S.compare.length >= MAX_COMPARE) {
          cb.checked = false;
          app().toast('最多一次比較 ' + MAX_COMPARE + ' 檔，請先取消其他檔');
          return;
        }
        S.compare.push(code);
      }
    } else if (i >= 0) S.compare.splice(i, 1);
    drawCompare();
  }

  function init(el) {
    rootEl = el;
    clear(el);
    el.classList.add('watch-view');

    els.count = h('span', { class: 'chip', id: 'watch-total' });
    els.hint = h('p', { class: 'muted watch-hint', text: '勾選 2～4 檔，可以把走勢與各項數字並排比較。點一列可以看個股詳情。' });
    els.empty = h('div', { class: 'empty watch-empty', id: 'watch-empty' }, [
      h('div', { class: 'empty-icon', 'aria-hidden': 'true', text: '☆' }),
      h('p', { text: '還沒有自選股。在選股結果或個股頁點 ☆ 就會加到這裡' }),
      h('button', { type: 'button', class: 'btn btn-primary', id: 'watch-go-screen', text: '去選股' })
    ]);
    els.tbody = h('tbody');
    var head = h('tr', null, [
      h('th', { scope: 'col', class: 'watch-cb', text: '比較' }), h('th', { scope: 'col', text: '股票' }),
      h('th', { scope: 'col', class: 'num', text: '收盤' }), h('th', { scope: 'col', class: 'num', text: '漲跌幅' }),
      h('th', { scope: 'col', text: '近 60 日走勢' }),
      h('th', { scope: 'col', class: 'num', text: '本益比' }), h('th', { scope: 'col', class: 'num', text: '殖利率' }),
      h('th', { scope: 'col', class: 'num', text: '營收年增' }), h('th', { scope: 'col', text: '六面向' }),
      h('th', { scope: 'col', class: 'watch-act', text: '' })
    ]);
    els.table = h('table', { id: 'watch-table', class: 'table' }, [h('thead', null, [head]), els.tbody]);
    els.tableWrap = h('div', { class: 'table-wrap watch-table-wrap', hidden: true }, [els.table]);

    els.cmpChart = h('div', { id: 'chart-compare', class: 'cmp-chart' });
    els.cmpNote = h('p', { class: 'muted cmp-note', id: 'compare-note' });
    els.cmpTable = h('table', { id: 'compare-table', class: 'table cmp-table' });
    var rangeBtns = [60, 120, 240].map(function (n) {
      return h('button', { type: 'button', class: 'btn btn-ghost btn-sm cmp-range', 'data-range': n, 'aria-pressed': n === S.range ? 'true' : 'false', text: '近 ' + n + ' 日' });
    });
    els.panel = h('section', { id: 'compare-panel', class: 'card sky cmp-panel', hidden: true }, [
      h('h3', { class: 'card-title', text: '並排比較' }),
      h('div', { class: 'row cmp-head' }, [h('p', { class: 'muted', text: '走勢圖把每檔的收盤價換算成起點 = 100，比的是漲跌的幅度，不是股價高低。' }), h('span', { class: 'spacer' }), h('div', { class: 'cmp-ranges', role: 'group', 'aria-label': '比較期間' }, rangeBtns)]),
      els.cmpChart, els.cmpNote,
      h('div', { class: 'table-wrap' }, [els.cmpTable]),
      h('p', { class: 'muted cmp-legend', text: '★ 標示每一列數字最高的一檔（本益比、股價淨值比、波動率、負債比則是最低的一檔）。這只是數字比較，不代表哪一檔比較好。' })
    ]);

    el.appendChild(h('header', { class: 'view-head' }, [
      h('h2', { class: 'view-title', text: '自選股與比較' }),
      h('div', { class: 'row' }, [els.count])
    ]));
    el.appendChild(els.empty);
    el.appendChild(els.hint);
    el.appendChild(els.tableWrap);
    el.appendChild(els.panel);

    el.querySelector('#watch-go-screen').addEventListener('click', function () { app().setView('screen'); });

    els.tbody.addEventListener('change', function (e) {
      if (e.target && e.target.classList && e.target.classList.contains('compare-check')) onCheck(e.target);
    });
    els.tbody.addEventListener('click', function (e) {
      var t = e.target;
      var rmv = t.closest ? t.closest('.watch-remove') : null;
      var tr = t.closest ? t.closest('tr.watch-row') : null;
      if (!tr) return;
      var code = tr.getAttribute('data-code');
      if (rmv) {
        e.stopPropagation();
        var i = S.compare.indexOf(code);
        if (i >= 0) S.compare.splice(i, 1);
        if (app().isWatched(code)) app().toggleWatch(code);
        else { renderAll(); }
        return;
      }
      if (t.closest && (t.closest('.compare-check') || t.closest('.term'))) return;
      if (tr.classList.contains('is-missing')) return;
      app().openDetail(code);
    });
    els.tbody.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      if (!(e.target && e.target.matches && e.target.matches('tr.watch-row'))) return;
      if (e.target.classList.contains('is-missing')) return;
      e.preventDefault();
      app().openDetail(e.target.getAttribute('data-code'));
    });
    els.panel.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('.cmp-range') : null;
      if (!b) return;
      S.range = Number(b.getAttribute('data-range'));
      drawCompare();
    });

    app().on('watch', function () { if (visible) renderAll(); else dirty = true; });
    app().on('data', function () { if (visible) renderAll(); else dirty = true; });
    renderAll();
  }

  function show() {
    visible = true;
    if (!rootEl) return;
    if (dirty) renderAll(); else drawCompare();
  }
  function hide() {
    visible = false;
    safeDestroy(cmpChart); cmpChart = null;
  }

  TW.app.registerView('watch', { init: init, show: show, hide: hide });
})(typeof globalThis !== 'undefined' ? globalThis : this);
(function () {
  var s = document.createElement("script");
  s.src = "data/snapshot.js";
  s.onload = s.onerror = function () { TW.app.boot(); };   // a missing snapshot.js is not an error
  document.head.appendChild(s);
})();
</script>
</body>
</html>
