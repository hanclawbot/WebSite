<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學習資源</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght=600;800;900&display=swap');
        
        body {
            font-family: 'Nunito', 'Microsoft JhengHei', sans-serif;
            background-color: #fdf2f8;
            background-image: radial-gradient(#fbcfe8 2px, transparent 2px);
            background-size: 30px 30px;
        }

        .cute-card {
            border: 4px solid #fff;
            box-shadow: 0 10px 25px rgba(255, 182, 193, 0.4);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .cute-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 35px rgba(255, 182, 193, 0.6);
            border-color: #fce7f3;
        }

        .icon-bounce {
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .cute-card:hover .icon-bounce {
            transform: scale(1.15) rotate(5deg);
        }

        .announcement-slider {
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
        }

        .announcement-box {
            border-left-width: 12px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-16 px-6">

    <header class="mb-10 text-center w-full max-w-7xl">
        <h1 class="text-4xl md:text-5xl font-black text-pink-500 tracking-wide drop-shadow-sm mb-3">
            學習資源
        </h1>
        <div class="h-2 w-24 bg-pink-300 rounded-full mx-auto"></div>
    </header>

    

    <main class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8 max-w-7xl w-full">
        
        <a href="https://eatingright.tp.edu.tw/html/index.php?old=true#" target="_blank" rel="noopener noreferrer" class="cute-card bg-white rounded-3xl overflow-hidden group flex flex-col no-underline">
            <div class="h-48 bg-emerald-100 flex items-center justify-center relative overflow-hidden">
                <div class="absolute inset-0 opacity-20" style="background-image: radial-gradient(rgba(16,185,129,0.15) 2px, transparent 2px); background-size: 15px 15px;"></div>
                <div class="text-emerald-500">
                    <svg class="w-24 h-24 icon-bounce relative z-10" fill="none" stroke="#10b981" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v1H6a3 3 0 0 0-3 3v3h1a3 3 0 0 1 0 6H3v3a3 3 0 0 0 3 3h3v-1a3 3 0 0 1 6 0v1h3a3 3 0 0 0 3-3v-3h-1a3 3 0 0 1 0-6h1V9a3 3 0 0 0-3-3h-3V5a3 3 0 0 0-3-3z"></path></svg>
                </div>
            </div>
            <div class="p-6 flex-1 flex items-center justify-center bg-white text-center">
                <h2 class="text-2xl font-extrabold text-emerald-500 opacity-90 group-hover:opacity-100 transition-opacity leading-tight">
                    臺北市Eatingright　學校營養午餐探索樂園
                </h2>
            </div>
        </a>
        
        <a href="https://eatingright.tp.edu.tw/eatgame95/" target="_blank" rel="noopener noreferrer" class="cute-card bg-white rounded-3xl overflow-hidden group flex flex-col no-underline">
            <div class="h-48 bg-yellow-100 flex items-center justify-center relative overflow-hidden">
                <div class="absolute inset-0 opacity-20" style="background-image: radial-gradient(rgba(234,179,8,0.15) 2px, transparent 2px); background-size: 15px 15px;"></div>
                <div class="text-yellow-500">
                    <svg class="w-24 h-24 icon-bounce relative z-10" fill="none" stroke="#eab308" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1.3.5 2.6 1.5 3.5.8.8 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg>
                </div>
            </div>
            <div class="p-6 flex-1 flex items-center justify-center bg-white text-center">
                <h2 class="text-2xl font-extrabold text-yellow-500 opacity-90 group-hover:opacity-100 transition-opacity leading-tight">
                    第95期 有獎徵答
                </h2>
            </div>
        </a>
    </main>

    

<script>
    var currentAnn = 0;
    var totalAnns = 1;
    var isAnnounceCollapsed = false;
    var annData = [{"theme":{"bg":"bg-yellow-100","text":"text-yellow-500","hex":"#eab308","annBg":"bg-yellow-50","annText":"text-yellow-900","annBorder":"border-yellow-400","radial":"rgba(234,179,8,0.15)"}}];

    window.renderAnnState = function() {
        var slider = document.getElementById('announceSliderBody');
        var controlBar = document.getElementById('announceControlBar');
        var icon = document.getElementById('annCollapseIcon');
        
        var oldLabel = controlBar.querySelector('.hint-label');
        if (oldLabel) oldLabel.remove();

        if (isAnnounceCollapsed) {
            slider.style.width = '0px';
            slider.style.opacity = '0';
            slider.style.overflow = 'hidden';
            icon.textContent = '◀';
            
            var hint = document.createElement('div');
            hint.className = 'hint-label text-xs text-gray-400 font-bold tracking-widest flex items-center justify-center px-2 py-4';
            hint.style.writingMode = 'vertical-lr';
            hint.style.userSelect = 'none';
            hint.textContent = '展開公告';
            controlBar.insertBefore(hint, controlBar.firstChild);
        } else {
            slider.style.width = '100%';
            slider.style.opacity = '1';
            slider.style.overflow = 'visible';
            icon.textContent = '▶';
        }

        var items = slider.querySelectorAll('.announcement-page-item');
        for (var i = 0; i < items.length; i++) {
            if (i === currentAnn) {
                items[i].style.display = isAnnounceCollapsed ? 'none' : 'block';
                
                if(!isAnnounceCollapsed && annData[i]) {
                    var box = items[i];
                    box.className = box.className.replace(/bg-\S+/g, '').replace(/text-\S+/g, '').replace(/border-\S+/g, '');
                    box.classList.add(annData[i].theme.annBg, annData[i].theme.annText, annData[i].theme.annBorder);
                }
            } else {
                items[i].style.display = 'none';
            }
        }

        var pageSpan = slider.querySelector('.pagination-text');
        if (pageSpan) {
            pageSpan.textContent = (currentAnn + 1) + ' / ' + totalAnns;
        }
    };

    window.changeAnn = function(dir) {
        currentAnn += dir;
        if (currentAnn < 0) currentAnn = totalAnns - 1;
        if (currentAnn >= totalAnns) currentAnn = 0;
        window.renderAnnState();
    };

    window.toggleAnnCollapse = function() {
        isAnnounceCollapsed = !isAnnounceCollapsed;
        window.renderAnnState();
    };
    
    // 初始化導出網頁狀態
    if(totalAnns > 0) {
        window.renderAnnState();
    }
</script>
</body>
</html>
